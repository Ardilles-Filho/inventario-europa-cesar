<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><title>Inventário Apple CESAR</title><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&display=swap">
<style>
/* Layout: app shell — barra lateral de navegação + área de trabalho; gaveta de detalhe à direita. Paleta oficial CESAR. */
:root {
  --bg: #ffffff;
  --surface: #f7f6f2;
  --surface-2: #efede6;
  --line: #e2dfd6;
  --fg: #161616;
  --fg-2: #3f3f3f;
  --muted: #6d7484;
  --accent: #ff6002;
  --accent-strong: #dd4012;
  --accent-soft: #fff0e6;
  --on-accent: #ffffff;
  --ok: #1f8a4c; --ok-soft: #e4f4ea;
  --info: #2763c4; --info-soft: #e5eefb;
  --held: #6a4bc4; --held-soft: #eee9fb;
  --bad: #c2321b; --bad-soft: #fbe7e3;
  --warn: #a66300; --warn-soft: #fbf0dc;
  --mute: #818b9d; --mute-soft: #eef0f3;
  --shadow: 0 1px 2px rgba(22,22,22,.06), 0 8px 24px rgba(22,22,22,.08);
  --font: "DM Sans", ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono: "DM Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  --r: 10px;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #161616; --surface: #1e1e1d; --surface-2: #272725; --line: #34332f;
  --fg: #f4f3ee; --fg-2: #cfcdc5; --muted: #9aa1ae;
  --accent: #ff6d1a; --accent-strong: #ff8a45; --accent-soft: #3a2214; --on-accent: #161616;
  --ok: #4fc485; --ok-soft: #173326; --info: #7aa7f0; --info-soft: #182840;
  --held: #a993f0; --held-soft: #261f3d; --bad: #f2775f; --bad-soft: #3d1c16;
  --warn: #e6a74a; --warn-soft: #3a2a12; --mute: #9aa1ae; --mute-soft: #2a2b2e;
  --shadow: 0 1px 2px rgba(0,0,0,.4), 0 8px 24px rgba(0,0,0,.45);
  color-scheme: dark;
} }
:root[data-theme="dark"] {
  --bg: #161616; --surface: #1e1e1d; --surface-2: #272725; --line: #34332f;
  --fg: #f4f3ee; --fg-2: #cfcdc5; --muted: #9aa1ae;
  --accent: #ff6d1a; --accent-strong: #ff8a45; --accent-soft: #3a2214; --on-accent: #161616;
  --ok: #4fc485; --ok-soft: #173326; --info: #7aa7f0; --info-soft: #182840;
  --held: #a993f0; --held-soft: #261f3d; --bad: #f2775f; --bad-soft: #3d1c16;
  --warn: #e6a74a; --warn-soft: #3a2a12; --mute: #9aa1ae; --mute-soft: #2a2b2e;
  --shadow: 0 1px 2px rgba(0,0,0,.4), 0 8px 24px rgba(0,0,0,.45);
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body { background: var(--bg); color: var(--fg); font-family: var(--font); font-size: 14px; line-height: 1.45; -webkit-font-smoothing: antialiased; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 30; background: var(--bg); }
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 6px; }
.mono { font-family: var(--mono); font-size: 12.5px; letter-spacing: -.01em; }
.num { font-variant-numeric: tabular-nums; }
.muted { color: var(--muted); }
h1, h2, h3 { margin: 0; text-wrap: balance; letter-spacing: -.015em; }
h1 { font-size: 24px; font-weight: 700; }
h2 { font-size: 16px; font-weight: 600; }
h3 { font-size: 13px; font-weight: 600; }
.eyebrow { font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); }

/* Shell */
#app { min-height: 100%; }
.shell { display: grid; grid-template-columns: 232px minmax(0, 1fr); min-height: 100vh; }
.side { position: sticky; top: env(safe-area-inset-top, 0px); height: calc(100vh - env(safe-area-inset-top, 0px)); border-right: 1px solid var(--line); background: var(--surface); padding: 20px 14px; padding-left: max(14px, env(safe-area-inset-left, 0px)); display: flex; flex-direction: column; gap: 22px; }
.brand { display: flex; align-items: center; gap: 10px; padding: 2px 6px; }
.brand-mark { width: 28px; height: 28px; position: relative; flex: none; }
.brand-mark i { position: absolute; border-radius: 50%; background: var(--accent); }
.brand-mark i:first-child { inset: 0 8px 8px 0; }
.brand-mark i:last-child { width: 14px; height: 14px; right: 0; bottom: 0; background: var(--fg); border-radius: 14px 0 0 0; }
.brand b { display: block; font-size: 14px; letter-spacing: -.01em; }
.brand span { display: block; font-size: 12px; color: var(--muted); }
.nav { display: flex; flex-direction: column; gap: 2px; }
.nav a { display: flex; align-items: center; gap: 10px; padding: 8px 10px; border-radius: 8px; color: var(--fg-2); text-decoration: none; font-weight: 500; }
.nav a:hover { background: var(--surface-2); }
.nav a[aria-current="page"] { background: var(--bg); color: var(--fg); box-shadow: inset 0 0 0 1px var(--line); }
.nav a[aria-current="page"] svg { color: var(--accent); }
.nav .count { margin-left: auto; font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }
.nav .count.hot { color: var(--bad); font-weight: 600; }
.side-foot { margin-top: auto; display: flex; flex-direction: column; gap: 8px; font-size: 12px; color: var(--muted); padding: 0 6px; }
.conn { display: inline-flex; align-items: center; gap: 6px; }
.conn::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: var(--mute); }
.conn.live::before { background: var(--ok); box-shadow: 0 0 0 3px var(--ok-soft); }
.conn.error::before, .conn.offline::before, .conn.timeout::before { background: var(--warn); }

.main { min-width: 0; display: flex; flex-direction: column; }
.topbar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: color-mix(in srgb, var(--bg) 88%, transparent); backdrop-filter: blur(10px); border-bottom: 1px solid var(--line); display: flex; align-items: center; gap: 12px; padding-block: 12px; padding-left: max(24px, env(safe-area-inset-left, 0px)); padding-right: max(24px, env(safe-area-inset-right, 0px)); }
.search { flex: 1; min-width: 0; max-width: 620px; position: relative; }
.search input { width: 100%; height: 38px; border-radius: 9px; border: 1px solid var(--line); background: var(--surface); padding: 0 64px 0 36px; outline: none; }
.search input:focus { border-color: var(--accent); background: var(--bg); box-shadow: 0 0 0 3px var(--accent-soft); }
.search svg { position: absolute; left: 11px; top: 11px; color: var(--muted); }
.search kbd { position: absolute; right: 10px; top: 9px; font-family: var(--mono); font-size: 11px; color: var(--muted); border: 1px solid var(--line); border-radius: 5px; padding: 1px 6px; background: var(--bg); }
.content { padding-block: 24px 64px; padding-left: max(24px, env(safe-area-inset-left, 0px)); padding-right: max(24px, env(safe-area-inset-right, 0px)); display: flex; flex-direction: column; gap: 24px; max-width: 1360px; width: 100%; }
.page-head { display: flex; align-items: flex-end; justify-content: space-between; gap: 16px; flex-wrap: wrap; }
.page-head p { margin: 4px 0 0; color: var(--muted); max-width: 70ch; }

/* Buttons & inputs */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; height: 34px; padding: 0 13px; border-radius: 8px; border: 1px solid var(--line); background: var(--bg); cursor: pointer; font-weight: 500; white-space: nowrap; }
.btn:hover { background: var(--surface); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
.btn.primary:hover { background: var(--accent-strong); border-color: var(--accent-strong); }
.btn.danger { color: var(--bad); }
.btn.ghost { border-color: transparent; background: transparent; }
.btn.ghost:hover { background: var(--surface-2); }
.btn.sm { height: 28px; padding: 0 10px; font-size: 13px; }
.btn[disabled] { opacity: .5; cursor: not-allowed; }
.icon-btn { width: 34px; padding: 0; }
.field { display: flex; flex-direction: column; gap: 5px; min-width: 0; }
.field label { font-size: 12px; font-weight: 500; color: var(--fg-2); }
.field input, .field select, .field textarea { height: 36px; border: 1px solid var(--line); border-radius: 8px; background: var(--bg); padding: 0 10px; width: 100%; min-width: 0; }
.field textarea { height: auto; min-height: 76px; padding: 8px 10px; resize: vertical; }
.field input:focus, .field select:focus, .field textarea:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
.field .err { font-size: 12px; color: var(--bad); }
.grid-2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }

/* Chips & pills */
.pill { display: inline-flex; align-items: center; gap: 6px; height: 22px; padding: 0 8px; border-radius: 999px; font-size: 12px; font-weight: 500; white-space: nowrap; background: var(--mute-soft); color: var(--fg-2); }
.pill::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: currentColor; opacity: .9; }
.pill.ok { background: var(--ok-soft); color: var(--ok); }
.pill.info { background: var(--info-soft); color: var(--info); }
.pill.held { background: var(--held-soft); color: var(--held); }
.pill.bad { background: var(--bad-soft); color: var(--bad); }
.pill.warn { background: var(--warn-soft); color: var(--warn); }
.pill.mute { background: var(--mute-soft); color: var(--mute); }
.pill.plain::before { display: none; }
.stage { font-size: 12.5px; color: var(--fg-2); white-space: nowrap; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { height: 30px; padding: 0 11px; border-radius: 999px; border: 1px solid var(--line); background: var(--bg); cursor: pointer; font-size: 13px; display: inline-flex; align-items: center; gap: 6px; }
.chip:hover { background: var(--surface); }
.chip[aria-pressed="true"] { background: var(--fg); border-color: var(--fg); color: var(--bg); }
.chip .n { font-variant-numeric: tabular-nums; opacity: .65; font-size: 12px; }
.qchip { display: inline-flex; align-items: center; gap: 6px; height: 26px; padding: 0 6px 0 10px; border-radius: 6px; background: var(--accent-soft); color: var(--accent-strong); font-size: 12.5px; font-weight: 500; }
.qchip button { border: 0; background: transparent; cursor: pointer; color: inherit; padding: 0 4px; font-size: 14px; line-height: 1; }

/* Panels */
.panel { background: var(--bg); border: 1px solid var(--line); border-radius: var(--r); }
.panel-h { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 14px 16px; border-bottom: 1px solid var(--line); }
.panel-b { padding: 16px; }
.kpis { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 12px; }
.kpi { padding: 16px; border-radius: var(--r); background: var(--surface); display: flex; flex-direction: column; gap: 6px; text-align: left; border: 1px solid transparent; cursor: pointer; }
.kpi:hover { border-color: var(--line); background: var(--bg); }
.kpi .v { font-size: 30px; font-weight: 600; letter-spacing: -.03em; font-variant-numeric: tabular-nums; line-height: 1.05; }
.kpi .l { font-size: 13px; color: var(--fg-2); font-weight: 500; }
.kpi .s { font-size: 12px; color: var(--muted); }
.kpi.accent { background: var(--accent); color: var(--on-accent); }
.kpi.accent .l, .kpi.accent .s { color: inherit; opacity: .9; }
.dash { display: grid; grid-template-columns: minmax(0, 1.35fr) minmax(0, 1fr); gap: 16px; align-items: start; }
.stack { display: flex; flex-direction: column; gap: 16px; min-width: 0; }

/* Category bars */
.bars { display: flex; flex-direction: column; gap: 12px; }
.bar-row { display: grid; grid-template-columns: 110px minmax(0, 1fr) 44px; gap: 12px; align-items: center; cursor: pointer; border-radius: 6px; }
.bar-row:hover .bar-track { box-shadow: 0 0 0 1px var(--line); }
.bar-row .lbl { font-weight: 500; font-size: 13px; }
.bar-row .tot { text-align: right; font-variant-numeric: tabular-nums; color: var(--fg-2); }
.bar-track { height: 14px; border-radius: 4px; background: var(--surface-2); display: flex; overflow: hidden; }
.bar-track span { height: 100%; }
.legend { display: flex; flex-wrap: wrap; gap: 14px; font-size: 12px; color: var(--fg-2); }
.legend i { display: inline-block; width: 9px; height: 9px; border-radius: 2px; margin-right: 6px; vertical-align: -1px; }
.c-disponivel { background: var(--ok); } .c-reservado { background: var(--info); } .c-alocado { background: var(--held); }
.c-emprestado { background: color-mix(in srgb, var(--held) 55%, var(--bg)); } .c-danificado { background: var(--bad); } .c-baixado { background: var(--mute); }

/* Pipeline */
.pipe { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 0; border: 1px solid var(--line); border-radius: var(--r); overflow: hidden; }
.pipe button { all: unset; cursor: pointer; padding: 14px; display: flex; flex-direction: column; gap: 4px; border-right: 1px solid var(--line); position: relative; }
.pipe button:last-child { border-right: 0; }
.pipe button:hover { background: var(--surface); }
.pipe button:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }
.pipe .v { font-size: 24px; font-weight: 600; font-variant-numeric: tabular-nums; letter-spacing: -.02em; }
.pipe .l { font-size: 12.5px; color: var(--fg-2); font-weight: 500; }
.pipe .s { font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }
.pipe button:not(:last-child)::after { content: ""; position: absolute; right: -6px; top: 50%; width: 10px; height: 10px; background: var(--bg); border-top: 1px solid var(--line); border-right: 1px solid var(--line); transform: translateY(-50%) rotate(45deg); z-index: 1; }

/* Lists */
.list { display: flex; flex-direction: column; }
.li { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 12px; align-items: center; padding: 10px 16px; border-top: 1px solid var(--line); cursor: pointer; text-align: left; background: none; border-left: 0; border-right: 0; border-bottom: 0; width: 100%; }
.li:first-child { border-top: 0; }
.li:hover { background: var(--surface); }
.li .t { font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.li .d { font-size: 12.5px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.sev { width: 4px; align-self: stretch; border-radius: 2px; background: var(--warn); }
.sev.bad { background: var(--bad); } .sev.info { background: var(--info); } .sev.mute { background: var(--mute); }
.avatar { width: 28px; height: 28px; border-radius: 50%; background: var(--surface-2); display: grid; place-items: center; font-size: 11px; font-weight: 600; color: var(--fg-2); }

/* Table */
.toolbar { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; justify-content: space-between; }
.filters { display: flex; flex-direction: column; gap: 10px; }
.table-wrap { overflow-x: auto; border: 1px solid var(--line); border-radius: var(--r); }
table { width: 100%; border-collapse: collapse; min-width: 880px; }
th { position: sticky; top: 0; background: var(--surface); text-align: left; font-size: 12px; font-weight: 600; color: var(--fg-2); padding: 9px 12px; border-bottom: 1px solid var(--line); white-space: nowrap; user-select: none; }
th button { all: unset; cursor: pointer; display: inline-flex; gap: 4px; align-items: center; }
th button:focus-visible { outline: 2px solid var(--accent); }
td { padding: 10px 12px; border-bottom: 1px solid var(--line); vertical-align: middle; }
tbody tr { cursor: pointer; }
tbody tr:hover td { background: var(--surface); }
tbody tr:last-child td { border-bottom: 0; }
td .t { font-weight: 500; }
td .sub { font-size: 12px; color: var(--muted); }
.flag { display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: var(--warn); margin-left: 6px; vertical-align: 1px; }
.more { display: flex; justify-content: center; padding: 12px; }

/* Board */
.board { display: grid; grid-template-columns: repeat(4, minmax(240px, 1fr)); gap: 12px; overflow-x: auto; padding-bottom: 4px; }
.col { background: var(--surface); border-radius: var(--r); padding: 10px; display: flex; flex-direction: column; gap: 8px; min-width: 0; }
.col-h { display: flex; justify-content: space-between; align-items: baseline; padding: 4px 4px 6px; }
.col-h .n { font-variant-numeric: tabular-nums; color: var(--muted); font-size: 12px; }
.card { background: var(--bg); border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; display: flex; flex-direction: column; gap: 6px; cursor: pointer; text-align: left; width: 100%; }
.card:hover { border-color: var(--fg-2); }
.card .row { display: flex; justify-content: space-between; gap: 8px; align-items: center; }
.age { font-size: 12px; font-variant-numeric: tabular-nums; color: var(--muted); }
.age.late { color: var(--bad); font-weight: 600; }

/* Drawer */
.scrim { position: fixed; inset: 0; background: rgba(22,22,22,.35); z-index: 40; animation: fade .15s ease; }
.drawer { position: fixed; top: 0; right: 0; bottom: 0; width: min(580px, 100%); background: var(--bg); z-index: 41; box-shadow: var(--shadow); display: flex; flex-direction: column; animation: slide .2s ease; padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); padding-right: env(safe-area-inset-right, 0px); }
.drawer-h { padding: 18px 20px 14px; border-bottom: 1px solid var(--line); display: flex; flex-direction: column; gap: 10px; }
.drawer-b { overflow-y: auto; padding: 18px 20px 28px; display: flex; flex-direction: column; gap: 22px; }
.drawer-top { display: flex; justify-content: space-between; gap: 12px; align-items: flex-start; }
.ids { display: flex; flex-wrap: wrap; gap: 6px 14px; color: var(--fg-2); }
.ids span b { font-weight: 500; color: var(--muted); font-family: var(--font); font-size: 12px; margin-right: 4px; }
.dl { display: grid; grid-template-columns: 140px minmax(0, 1fr); gap: 8px 14px; margin: 0; }
.dl dt { color: var(--muted); font-size: 13px; }
.dl dd { margin: 0; min-width: 0; overflow-wrap: anywhere; }
.actions { display: flex; flex-wrap: wrap; gap: 8px; }
.action-form { border: 1px solid var(--accent); border-radius: var(--r); padding: 14px; display: flex; flex-direction: column; gap: 12px; background: var(--accent-soft); }
.action-form .field input, .action-form .field select, .action-form .field textarea { background: var(--bg); }
.timeline { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; }
.timeline li { display: grid; grid-template-columns: 14px minmax(0, 1fr); gap: 12px; padding-bottom: 14px; position: relative; }
.timeline li::before { content: ""; position: absolute; left: 6px; top: 14px; bottom: 0; width: 1px; background: var(--line); }
.timeline li:last-child::before { display: none; }
.timeline .dot { width: 13px; height: 13px; border-radius: 50%; border: 2px solid var(--line); background: var(--bg); margin-top: 3px; }
.timeline .dot.reparo { border-color: var(--bad); } .timeline .dot.entrega, .timeline .dot.emprestimo { border-color: var(--held); }
.timeline .dot.devolucao, .timeline .dot.recebido { border-color: var(--ok); } .timeline .dot.nota { border-color: var(--info); }
.timeline .tt { font-weight: 500; }
.timeline .tm { font-size: 12px; color: var(--muted); }
.timeline .tx { font-size: 13px; color: var(--fg-2); margin-top: 2px; overflow-wrap: anywhere; }
.section-t { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }

/* Assistant */
.chat { display: flex; flex-direction: column; gap: 14px; }
.msg { max-width: 72ch; padding: 12px 14px; border-radius: 12px; overflow-wrap: anywhere; }
.msg.user { align-self: flex-end; background: var(--fg); color: var(--bg); border-bottom-right-radius: 4px; }
.msg.bot { align-self: flex-start; background: var(--surface); border-bottom-left-radius: 4px; }
.msg.bot p { margin: 0 0 8px; } .msg.bot p:last-child { margin: 0; }
.msg.bot ul { margin: 4px 0 8px; padding-left: 18px; }
.msg .ref { all: unset; cursor: pointer; font-family: var(--mono); font-size: 12.5px; color: var(--accent-strong); text-decoration: underline; text-underline-offset: 2px; }
.composer { display: flex; gap: 8px; position: sticky; bottom: 0; background: var(--bg); padding-block: 12px; }
.composer input { flex: 1; min-width: 0; height: 42px; border-radius: 10px; border: 1px solid var(--line); padding: 0 14px; background: var(--surface); }
.composer input:focus { outline: none; border-color: var(--accent); background: var(--bg); }
.thinking { color: var(--muted); font-size: 13px; }

/* Misc */
.banner { border-radius: var(--r); padding: 12px 14px; background: var(--warn-soft); color: var(--fg); display: flex; gap: 10px; align-items: flex-start; }
.banner b { color: var(--warn); }
.empty { padding: 40px 20px; text-align: center; color: var(--muted); display: flex; flex-direction: column; gap: 10px; align-items: center; }
.empty h2 { color: var(--fg); }
.toasts { position: fixed; bottom: max(16px, env(safe-area-inset-bottom, 0px)); left: 50%; transform: translateX(-50%); z-index: 60; display: flex; flex-direction: column; gap: 8px; align-items: center; pointer-events: none; }
.toast { background: var(--fg); color: var(--bg); padding: 10px 14px; border-radius: 9px; box-shadow: var(--shadow); font-weight: 500; animation: rise .2s ease; pointer-events: auto; }
.toast.err { background: var(--bad); color: #fff; }
.skeleton { height: 14px; border-radius: 4px; background: linear-gradient(90deg, var(--surface) 0%, var(--surface-2) 50%, var(--surface) 100%); background-size: 200% 100%; animation: shimmer 1.2s infinite; }
.qgroups { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 16px; align-items: start; }
.prov { font-size: 12.5px; color: var(--muted); }
.bottom-nav { display: none; }

@keyframes fade { from { opacity: 0 } }
@keyframes slide { from { transform: translateX(24px); opacity: .6 } }
@keyframes rise { from { transform: translateY(8px); opacity: 0 } }
@keyframes shimmer { to { background-position: -200% 0 } }
@media (prefers-reduced-motion: reduce) { *, *::before { animation: none !important; transition: none !important; } }

@media (max-width: 1100px) {
  .kpis { grid-template-columns: repeat(3, minmax(0, 1fr)); }
  .dash { grid-template-columns: minmax(0, 1fr); }
}
@media (max-width: 760px) {
  .shell { grid-template-columns: minmax(0, 1fr); }
  .side { display: none; }
  .topbar { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
  .content { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-bottom: 96px; }
  .kpis { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .pipe { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .pipe button:nth-child(2) { border-right: 0; }
  .pipe button:nth-child(-n+2) { border-bottom: 1px solid var(--line); }
  .pipe button::after { display: none; }
  .grid-2 { grid-template-columns: minmax(0, 1fr); }
  .dl { grid-template-columns: minmax(0, 1fr); gap: 2px 0; }
  .dl dd { margin-bottom: 8px; }
  .bar-row { grid-template-columns: 84px minmax(0, 1fr) 36px; gap: 8px; }
  .new-label { display: none; }
  .search kbd { display: none; }
  .bottom-nav { display: grid; grid-template-columns: repeat(5, 1fr); position: fixed; left: 0; right: 0; bottom: 0; z-index: 25; background: var(--surface); border-top: 1px solid var(--line); padding-bottom: env(safe-area-inset-bottom, 0px); padding-left: env(safe-area-inset-left, 0px); padding-right: env(safe-area-inset-right, 0px); }
  .bottom-nav a { display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 8px 0 6px; font-size: 11px; color: var(--muted); text-decoration: none; }
  .bottom-nav a[aria-current="page"] { color: var(--accent-strong); }
}
/* Login */
.login { min-height: 100vh; display: grid; place-items: center; padding: 24px; background: var(--surface); }
.login-card { width: min(420px, 100%); background: var(--bg); border: 1px solid var(--line); border-radius: 14px; padding: 32px 28px; display: flex; flex-direction: column; gap: 18px; box-shadow: var(--shadow); }
.login-card p { margin: 0; color: var(--fg-2); }
.login-card .btn { height: 42px; justify-content: center; font-size: 15px; }
.login-card .err { color: var(--bad); font-size: 13px; }
.who { display: flex; align-items: center; gap: 8px; min-width: 0; }
.who span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
/* Colaboradores e máquinas secundárias */
.people-form { display: grid; grid-template-columns: minmax(0, 2fr) minmax(0, 1.5fr) auto; gap: 10px; align-items: end; }
.people-form .btn { height: 36px; }
.link { all: unset; cursor: pointer; color: var(--accent-strong); text-decoration: underline; text-underline-offset: 2px; }
.link:focus-visible { outline: 2px solid var(--accent); border-radius: 4px; }
.sec-list { display: flex; flex-direction: column; border: 1px solid var(--line); border-radius: var(--r); overflow: hidden; }
.sec-list .li { padding: 9px 12px; }
td .actions-inline { display: flex; gap: 6px; justify-content: flex-end; }
@media (max-width: 860px) { .people-form { grid-template-columns: minmax(0, 1fr); } }

<script type="module">
import { html, render, useState, useEffect, useMemo, useRef, useCallback } from 'https://cdn.jsdelivr.net/npm/htm@3.1.1/preact/standalone.module.js';

/* ================================================================
   1. DOMÍNIO — vocabulário, regras de negócio e fluxo de estados
   ================================================================ */
const STATUS = {
  disponivel: { label: 'Disponível', tone: 'ok' },
  reservado:  { label: 'Reservado', tone: 'info' },
  alocado:    { label: 'Alocado', tone: 'held' },
  emprestado: { label: 'Emprestado', tone: 'held' },
  danificado: { label: 'Danificado', tone: 'bad' },
  baixado:    { label: 'Baixado', tone: 'mute' },
};
const ETAPA = {
  suporte:     { label: 'No suporte' },
  colaborador: { label: 'Com colaborador' },
  orcamento:   { label: 'Aguardando orçamento', repair: 1 },
  aprovacao:   { label: 'Aguardando aprovação', repair: 2 },
  reparo:      { label: 'Em reparo', repair: 3 },
  retirada:    { label: 'Pronto p/ retirada', repair: 4 },
  inviavel:    { label: 'Orçamento inviável' },
  oficina:     { label: 'Oficina CESAR' },
  baixa:       { label: 'Fora de uso' },
};
const CATEG = { notebook: 'Notebooks', celular: 'Celulares', tablet: 'Tablets', monitor: 'Monitores', desktop: 'Desktops', acessorio: 'Acessórios', outro: 'Outros' };
const CATEG_ONE = { notebook: 'Notebook', celular: 'Celular', tablet: 'Tablet', monitor: 'Monitor', desktop: 'Desktop', acessorio: 'Acessório', outro: 'Outro' };
const REPAIR_STAGES = ['orcamento', 'aprovacao', 'reparo', 'retirada'];
const FORNECEDORES = ['iPlace', 'Mané', 'iJobe', 'Applecare', 'Outra assistência'];
const STALE_DAYS = 30;

const isRepair = a => !!ETAPA[a.etapa]?.repair;
/** Tombamentos de máquinas secundárias -> ativo principal (derivado do campo "secundarias" dos principais). */
let SEC_INDEX = new Map();
const buildSecIndex = list => { const m = new Map(); list.forEach(a => (a.secundarias || []).forEach(t => { if (!m.has(t)) m.set(t, a); })); SEC_INDEX = m; };
const primaryOf = a => (a.tombamento && SEC_INDEX.get(a.tombamento)) || null;
const isSecondary = a => !!primaryOf(a) || !!a.principalExterna;
const parseTombs = s => [...new Set((Array.isArray(s) ? s.join(' ') : String(s || '')).match(/\d{1,6}/g) || [])].map(t => t.padStart(6, '0'));
const today = () => new Date().toISOString().slice(0, 10);
const nowIso = () => new Date().toISOString();
const daysSince = iso => iso ? Math.floor((Date.now() - new Date(iso).getTime()) / 864e5) : null;
const norm = s => (s ?? '').toString().normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase();
const brl = new Intl.NumberFormat('pt-BR', { style: 'currency', currency: 'BRL', maximumFractionDigits: 0 });
const fmtMoney = v => (v == null || isNaN(v)) ? '—' : brl.format(v);
const fmtDate = iso => { if (!iso) return '—'; const d = new Date(iso.length === 10 ? iso + 'T12:00:00' : iso); return d.toLocaleDateString('pt-BR', { day: '2-digit', month: 'short', year: 'numeric' }).replace('.', ''); };
const assetName = a => a.tipo || CATEG_ONE[a.categoria] || 'Equipamento';
const assetCode = a => a.tombamento ? a.tombamento : (a.serial ? a.serial : 'sem identificação');

/** Desde quando o ativo está na etapa atual (último evento que levou a ela). */
function stageSince(a) {
  const h = a.historico || [];
  for (let i = h.length - 1; i >= 0; i--) if (h[i].para?.etapa === a.etapa) return h[i].data;
  if (isRepair(a)) return a.reparo?.entrada || null;
  return null;
}

/** Regras de qualidade de dados e alertas operacionais. */
const CHECKS = [
  { id: 'parado', sev: 'bad', title: 'Parado na assistência', hint: `Em fluxo de reparo há mais de ${STALE_DAYS} dias`,
    test: a => isRepair(a) && (daysSince(stageSince(a)) ?? 0) > STALE_DAYS, detail: a => `${daysSince(stageSince(a))} dias em "${ETAPA[a.etapa].label}"` },
  { id: 'triagem', sev: 'warn', title: 'Danificado sem encaminhamento', hint: 'Está no suporte com defeito e ainda não foi para orçamento, oficina ou baixa',
    test: a => a.status === 'danificado' && a.etapa === 'suporte', detail: a => a.reparo?.defeito || a.observacoes || 'Defeito não descrito' },
  { id: 'sem_serial', sev: 'warn', title: 'Sem número de série', hint: 'Sem serial não dá para acionar garantia nem cruzar com o Apex One',
    test: a => !a.serial && !a.imei && a.status !== 'baixado', detail: a => a.tombamento ? `Tomb. ${a.tombamento}` : 'Também sem tombamento' },
  { id: 'sem_tomb', sev: 'info', title: 'Sem tombamento', hint: 'Patrimônio não identificado na planilha',
    test: a => !a.tombamento && a.status !== 'baixado', detail: a => a.serial ? `S/N ${a.serial}` : 'Também sem serial' },
  { id: 'sem_pessoa', sev: 'warn', title: 'Com colaborador sem nome', hint: 'Status diz que está com alguém, mas não diz com quem',
    test: a => (a.etapa === 'colaborador' || a.status === 'alocado' || a.status === 'emprestado') && !a.responsavel, detail: a => STATUS[a.status]?.label },
  { id: 'reserva', sev: 'info', title: 'Reserva sem destinatário', hint: 'Marcado como reservado sem indicar para quem',
    test: a => a.status === 'reservado' && !a.reservadoPara, detail: a => a.observacoes || '' },
  { id: 'apexone', sev: 'info', title: 'Notebook em uso sem Apex One', hint: 'Notebook com colaborador sem agente Apex One registrado',
    test: a => a.categoria === 'notebook' && a.etapa === 'colaborador' && !a.apexone, detail: a => a.responsavel || '' },
  { id: 'historico', sev: 'mute', title: 'Só aparece no histórico', hint: 'Veio das abas Garantia ou Arquivo; confirmar se o equipamento ainda existe',
    test: a => a.arquivado && a.status !== 'baixado', detail: a => (a.fontes || [])[0] || '' },
];

/** Fluxo de trabalho: cada ação sabe quando vale, o que pede e o que muda. */
const ACTIONS = [
  { id: 'entregar', label: 'Entregar a colaborador', primary: true,
    when: a => ['disponivel', 'reservado'].includes(a.status) && ['suporte', 'oficina'].includes(a.etapa),
    fields: [
      { k: 'pessoa', label: 'Colaborador', req: true, list: 'dl-pessoas', def: a => a.reservadoPara || '' },
      { k: 'modo', label: 'Tipo de entrega', type: 'select', options: [['alocado', 'Alocação'], ['emprestado', 'Empréstimo']] },
      { k: 'aprovador', label: 'Aprovador / gerente', list: 'dl-pessoas', def: a => a.aprovador || '' },
      { k: 'nota', label: 'Observação', type: 'textarea' }],
    apply: (a, v) => ({ status: v.modo || 'alocado', etapa: 'colaborador', responsavel: v.pessoa, reservadoPara: null, aprovador: v.aprovador || a.aprovador }),
    event: (a, v) => ({ tipo: 'entrega', titulo: `${v.modo === 'emprestado' ? 'Emprestado' : 'Alocado'} para ${v.pessoa}`, texto: v.nota }) },
  { id: 'reservar', label: 'Reservar',
    when: a => a.status === 'disponivel' && !isRepair(a) && a.etapa !== 'colaborador',
    fields: [{ k: 'pessoa', label: 'Reservar para', req: true, list: 'dl-pessoas' }, { k: 'nota', label: 'Observação', type: 'textarea' }],
    apply: (a, v) => ({ status: 'reservado', reservadoPara: v.pessoa }),
    event: (a, v) => ({ tipo: 'reserva', titulo: `Reservado para ${v.pessoa}`, texto: v.nota }) },
  { id: 'cancelar', label: 'Cancelar reserva', when: a => a.status === 'reservado',
    apply: () => ({ status: 'disponivel', reservadoPara: null }), event: a => ({ tipo: 'reserva', titulo: 'Reserva cancelada' }) },
  { id: 'devolver', label: 'Registrar devolução', primary: true, when: a => a.etapa === 'colaborador',
    fields: [{ k: 'estado', label: 'Como voltou', type: 'select', options: [['ok', 'Funcionando'], ['defeito', 'Com defeito']] }, { k: 'nota', label: 'Observação / defeito', type: 'textarea' }],
    apply: (a, v) => ({ status: v.estado === 'defeito' ? 'danificado' : 'disponivel', etapa: 'suporte', antigoDono: a.responsavel || a.antigoDono, responsavel: null,
      reparo: v.estado === 'defeito' ? { defeito: v.nota || null } : a.reparo }),
    event: (a, v) => ({ tipo: 'devolucao', titulo: `Devolvido${a.responsavel ? ' por ' + a.responsavel : ''}`, texto: v.nota }) },
  { id: 'defeito', label: 'Registrar defeito',
    when: a => !['danificado', 'baixado'].includes(a.status) && !isRepair(a),
    fields: [{ k: 'defeito', label: 'Defeito', req: true, type: 'textarea' }],
    apply: (a, v) => ({ status: 'danificado', reparo: { defeito: v.defeito } }),
    event: (a, v) => ({ tipo: 'reparo', titulo: 'Defeito registrado', texto: v.defeito }) },
  { id: 'enviar', label: 'Enviar para assistência', primary: true,
    when: a => a.status === 'danificado' && ['suporte', 'oficina', 'inviavel'].includes(a.etapa),
    fields: [
      { k: 'fornecedor', label: 'Assistência', type: 'select', options: FORNECEDORES.map(f => [f, f]) },
      { k: 'os', label: 'Nº da O.S.' },
      { k: 'defeito', label: 'Defeito', type: 'textarea', def: a => a.reparo?.defeito || '' }],
    apply: (a, v) => ({ etapa: 'orcamento', fornecedor: v.fornecedor, reparo: { defeito: v.defeito || null, os: v.os || null, entrada: today() } }),
    event: (a, v) => ({ tipo: 'reparo', titulo: `Enviado para ${v.fornecedor}`, texto: [v.os && `O.S. ${v.os}`, v.defeito].filter(Boolean).join(' · ') }) },
  { id: 'orcar', label: 'Registrar orçamento', primary: true, when: a => a.etapa === 'orcamento',
    fields: [
      { k: 'cobertura', label: 'Cobertura', type: 'select', options: [['', 'Pago pelo CESAR'], ['Garantia', 'Garantia'], ['Applecare', 'AppleCare'], ['Recall', 'Recall']] },
      { k: 'valor', label: 'Valor do orçamento (R$)', type: 'number' }],
    validate: v => (!v.cobertura && !(Number(v.valor) > 0)) ? { valor: 'Informe o valor ou escolha uma cobertura.' } : null,
    apply: (a, v) => ({ etapa: v.cobertura ? 'reparo' : 'aprovacao', reparo: { ...a.reparo, orcamento: v.cobertura ? null : Number(v.valor), cobertura: v.cobertura || null } }),
    event: (a, v) => ({ tipo: 'reparo', titulo: v.cobertura ? `Coberto por ${v.cobertura}` : `Orçamento de ${fmtMoney(Number(v.valor))}`, valor: v.cobertura ? null : Number(v.valor) }) },
  { id: 'aprovar', label: 'Aprovar orçamento', primary: true, when: a => a.etapa === 'aprovacao',
    fields: [{ k: 'aprovador', label: 'Aprovado por', req: true, list: 'dl-pessoas', def: a => a.aprovador || '' }, { k: 'chamado', label: 'Chamado Zeev' }],
    apply: (a, v) => ({ etapa: 'reparo', aprovador: v.aprovador, reparo: { ...a.reparo, chamado: v.chamado || a.reparo?.chamado || null } }),
    event: (a, v) => ({ tipo: 'reparo', titulo: `Orçamento aprovado por ${v.aprovador}`, texto: v.chamado ? `Zeev ${v.chamado}` : null }) },
  { id: 'inviavel', label: 'Marcar como inviável', when: a => ['orcamento', 'aprovacao'].includes(a.etapa),
    fields: [{ k: 'nota', label: 'Motivo', type: 'textarea' }],
    apply: () => ({ etapa: 'inviavel' }), event: (a, v) => ({ tipo: 'reparo', titulo: 'Orçamento inviável', texto: v.nota }) },
  { id: 'pronto', label: 'Pronto para retirada', primary: true, when: a => a.etapa === 'reparo',
    fields: [{ k: 'nf', label: 'Nota fiscal' }],
    apply: (a, v) => ({ etapa: 'retirada', reparo: { ...a.reparo, nf: v.nf || a.reparo?.nf || null } }),
    event: (a, v) => ({ tipo: 'reparo', titulo: 'Reparo concluído, aguardando retirada', texto: v.nf ? `NF ${v.nf}` : null }) },
  { id: 'receber', label: 'Recebido no suporte', primary: true, when: a => a.etapa === 'retirada',
    apply: a => ({ status: 'disponivel', etapa: 'suporte', reparo: { ...a.reparo, retorno: today() } }),
    event: a => ({ tipo: 'recebido', titulo: 'Voltou da assistência', texto: a.fornecedor ? `Retirado na ${a.fornecedor}` : null }) },
  { id: 'oficina', label: 'Mandar para oficina CESAR', when: a => a.status === 'danificado' && ['suporte', 'inviavel'].includes(a.etapa),
    fields: [{ k: 'nota', label: 'Observação', type: 'textarea' }],
    apply: () => ({ etapa: 'oficina' }), event: (a, v) => ({ tipo: 'reparo', titulo: 'Enviado para a oficina CESAR', texto: v.nota }) },
  { id: 'baixa', label: 'Dar baixa', danger: true,
    when: a => a.status !== 'baixado' && (a.status === 'danificado' || ['oficina', 'inviavel'].includes(a.etapa)) && !['orcamento', 'aprovacao', 'reparo', 'retirada'].includes(a.etapa),
    fields: [{ k: 'motivo', label: 'Motivo da baixa', req: true, type: 'textarea' }],
    apply: () => ({ status: 'baixado', etapa: 'baixa', responsavel: null, reservadoPara: null }),
    event: (a, v) => ({ tipo: 'baixa', titulo: 'Baixa patrimonial', texto: v.motivo }) },
  { id: 'nota', label: 'Adicionar nota', when: () => true,
    fields: [{ k: 'texto', label: 'Nota', req: true, type: 'textarea' }],
    apply: () => ({}), event: (a, v) => ({ tipo: 'nota', titulo: 'Nota', texto: v.texto }) },
];

/* ---------- Busca inteligente: entende status, etapa, categoria e chip ---------- */
const VOCAB = [
  ...['disponivel', 'disponiveis', 'livre', 'livres'].map(w => [w, 'status', 'disponivel']),
  ...['reservado', 'reservados', 'reserva'].map(w => [w, 'status', 'reservado']),
  ...['alocado', 'alocados'].map(w => [w, 'status', 'alocado']),
  ...['emprestado', 'emprestados', 'emprestimo'].map(w => [w, 'status', 'emprestado']),
  ...['danificado', 'danificados', 'quebrado', 'quebrados', 'defeito'].map(w => [w, 'status', 'danificado']),
  ...['baixado', 'baixados'].map(w => [w, 'status', 'baixado']),
  ...['reparo', 'assistencia', 'conserto'].map(w => [w, 'fluxo', 'reparo']),
  ...['orcamento'].map(w => [w, 'etapa', 'orcamento']),
  ...['aprovacao'].map(w => [w, 'etapa', 'aprovacao']),
  ...['retirada'].map(w => [w, 'etapa', 'retirada']),
  ...['oficina'].map(w => [w, 'etapa', 'oficina']),
  ...['colaborador', 'colaboradores', 'uso'].map(w => [w, 'etapa', 'colaborador']),
  ...['notebook', 'notebooks', 'macbook', 'macbooks', 'mac', 'macs'].map(w => [w, 'categoria', 'notebook']),
  ...['iphone', 'iphones', 'celular', 'celulares', 'smartphone'].map(w => [w, 'categoria', 'celular']),
  ...['ipad', 'ipads', 'tablet', 'tablets'].map(w => [w, 'categoria', 'tablet']),
  ...['monitor', 'monitores'].map(w => [w, 'categoria', 'monitor']),
  ...['secundaria', 'secundarias', 'secundario', 'secundarios'].map(w => [w, 'uso', 'secundaria']),
  ...['m1', 'm2', 'm3', 'm4', 'm5'].map(w => [w, 'chip', 'Apple ' + w.toUpperCase()]),
  ...['intel', 'i7', 'i9', 'i5'].map(w => [w, 'chip', w === 'intel' ? 'Intel' : 'Intel Core ' + w])
];
const VOCAB_MAP = new Map(VOCAB.map(([w, k, v]) => [w, { k, v }]));
const FILTER_LABEL = { status: 'Status', etapa: 'Etapa', categoria: 'Tipo', chip: 'Chip', fluxo: 'Fluxo', flag: 'Pendência', uso: 'Uso' };
const valueLabel = (k, v) => k === 'status' ? STATUS[v]?.label : k === 'etapa' ? ETAPA[v]?.label : k === 'categoria' ? CATEG[v] : k === 'fluxo' ? 'Em reparo' : k === 'uso' ? 'Máquina secundária' : k === 'flag' ? CHECKS.find(c => c.id === v)?.title : v;

function parseQuery(q) {
  const filters = []; const words = [];
  let s = norm(q);
  const phrases = [['sem serial', 'sem_serial'], ['sem tombamento', 'sem_tomb'], ['sem tomb', 'sem_tomb'], ['parados', 'parado'], ['parado', 'parado'], ['sem apex one', 'apexone'], ['sem apexone', 'apexone'], ['sem apex', 'apexone']];
  for (const [p, id] of phrases) if (s.includes(p)) { if (!filters.some(f => f.v === id)) filters.push({ k: 'flag', v: id }); s = s.replace(p, ' '); }
  for (const tok of s.split(/\s+/).filter(Boolean)) {
    const hit = VOCAB_MAP.get(tok);
    if (hit && !filters.some(f => f.k === hit.k && f.v === hit.v)) filters.push(hit);
    else if (!['com', 'de', 'do', 'da', 'em', 'no', 'na', 'os', 'as', 'e', 'que', 'para'].includes(tok)) words.push(tok);
  }
  return { filters, words };
}
const haystack = a => norm([a.tombamento, ...(a.tombamentosAnteriores || []), a.serial, a.imei, a.tipo, a.configuracao, a.chip, a.responsavel, a.reservadoPara, a.antigoDono, a.aprovador, a.observacoes, a.fornecedor, a.reparo?.os, a.reparo?.defeito, a.centroCusto, a.apexone, a.projeto, ...(a.secundarias || [])].filter(Boolean).join(' '));
function matchFilter(a, f) {
  if (f.k === 'status') return a.status === f.v;
  if (f.k === 'etapa') return a.etapa === f.v;
  if (f.k === 'categoria') return a.categoria === f.v;
  if (f.k === 'fluxo') return isRepair(a);
  if (f.k === 'chip') return (a.chip || '').startsWith(f.v) || norm(a.tipo + ' ' + a.configuracao).includes(norm(f.v.replace('Apple ', '').replace('Intel Core ', '')));
  if (f.k === 'flag') return CHECKS.find(c => c.id === f.v)?.test(a);
  if (f.k === 'uso') return isSecondary(a);
  return true;
}
function applySearch(list, parsed) {
  // Filtros do mesmo tipo combinam com OU; tipos diferentes com E.
  const groups = {}; parsed.filters.forEach(f => (groups[f.k] ||= []).push(f));
  return list.filter(a => Object.values(groups).every(g => g.some(f => matchFilter(a, f))) && parsed.words.every(w => (a._hay ||= haystack(a)).includes(w)));
}

/* ================================================================
   2. DADOS — repositório sobre o banco compartilhado do artefato
   ================================================================ */
const store = {
  state: { authReady: false, authUser: null, authError: null, assets: [], people: [], peopleLoaded: false, conn: 'connecting', connError: null, meId: null, names: {}, meta: null, toasts: [] },
  subs: new Set(),
  set(patch) { this.state = { ...this.state, ...patch }; this.subs.forEach(f => f()); },
};
function useStore(sel) {
  const [, force] = useState(0);
  useEffect(() => { const f = () => force(x => x + 1); store.subs.add(f); return () => store.subs.delete(f); }, []);
  return sel(store.state);
}
function toast(text, err) {
  const id = Math.random().toString(36).slice(2);
  store.set({ toasts: [...store.state.toasts, { id, text, err }] });
  setTimeout(() => store.set({ toasts: store.state.toasts.filter(t => t.id !== id) }), err ? 6000 : 3200);
}
function docsFrom(snap) {
  const arr = Array.isArray(snap) ? snap : (snap?.docs ?? snap?.items ?? snap?.documents ?? []);
  return arr.map(d => {
    const data = typeof d?.data === 'function' ? d.data() : (d?.data && typeof d.data === 'object' ? d.data : d);
    return { ...data, id: data?.id ?? d?.id };
  }).filter(x => x && x.id);
}
const clean = obj => JSON.parse(JSON.stringify(obj, (k, v) => (k.startsWith('_') ? undefined : v)));

const Repo = {
  db: null, user: null, writing: new Map(),
  /** Login com Google e assinatura das coleções do Firestore. */
  init() {
    const auth = firebase.auth();
    auth.onAuthStateChanged(async u => {
      if (!u) { this.stop(); store.set({ authReady: true, authUser: null, assets: [], people: [], peopleLoaded: false, conn: 'connecting' }); return; }
      const dom = (window.DOMINIO_PERMITIDO || '').toLowerCase();
      if (dom && !(u.email || '').toLowerCase().endsWith('@' + dom)) {
        await auth.signOut();
        store.set({ authReady: true, authUser: null, authError: `Entre com seu e-mail @${dom}. A conta ${u.email} não tem acesso.` });
        return;
      }
      const nome = u.displayName || u.email;
      store.set({ authReady: true, authError: null, authUser: { uid: u.uid, nome, email: u.email }, meId: u.uid, names: { ...store.state.names, [u.uid]: nome }, conn: 'connecting' });
      this.start();
    });
  },
  async signIn() {
    const provider = new firebase.auth.GoogleAuthProvider();
    if (window.DOMINIO_PERMITIDO) provider.setCustomParameters({ hd: window.DOMINIO_PERMITIDO, prompt: 'select_account' });
    store.set({ authError: null });
    try { await firebase.auth().signInWithPopup(provider); }
    catch (e) {
      if (e?.code === 'auth/popup-blocked' || e?.code === 'auth/operation-not-supported-in-this-environment') { await firebase.auth().signInWithRedirect(provider); return; }
      if (e?.code === 'auth/popup-closed-by-user' || e?.code === 'auth/cancelled-popup-request') return;
      store.set({ authError: e?.code === 'auth/unauthorized-domain' ? 'Este endereço não está autorizado no Firebase (Authentication → Settings → Domínios autorizados).' : `Não foi possível entrar: ${e?.message || e}` });
    }
  },
  signOut() { firebase.auth().signOut(); },
  stop() { this.unsub?.(); this.unsubPeople?.(); this.unsub = this.unsubPeople = null; this.db = null; },
  start() {
    this.stop();
    const db = firebase.firestore(); this.db = db;
    const friendly = err => /permission/i.test(String(err?.code || err?.message)) ? 'Sua conta não tem permissão para ler o inventário. Confira as regras do Firestore.' : (err?.message || String(err));
    const timer = setTimeout(() => { if (store.state.conn === 'connecting') store.set({ conn: 'timeout' }); }, 10000);
    this.unsub = db.collection('ativos').onSnapshot(snap => {
      clearTimeout(timer);
      const list = docsFrom(snap).map(a => ({ ...a, historico: a.historico || [] }));
      list.sort((x, y) => (y.atualizadoEm || '').localeCompare(x.atualizadoEm || ''));
      buildSecIndex(list);
      store.set({ assets: list, conn: 'live' });
    }, err => { clearTimeout(timer); store.set({ conn: 'error', connError: friendly(err) }); });
    this.unsubPeople = db.collection('colaboradores').onSnapshot(snap => {
      const list = docsFrom(snap).filter(p => p.nome).sort((x, y) => x.nome.localeCompare(y.nome, 'pt-BR'));
      store.set({ people: list, peopleLoaded: true });
    }, () => store.set({ peopleLoaded: true }));
    db.doc('sistema/importacao').get().then(m => { const data = m.exists ? m.data() : null; if (data && (data.linhasLidas || data.arquivo)) store.set({ meta: data }); }).catch(() => {});
  },
  resolveNames() {},
  /** Aplica uma mudança + evento de histórico, com atualização otimista. */
  async commit(asset, patch, ev) {
    if (!this.db) { toast('Sem conexão com o banco: a alteração não foi salva.', true); return false; }
    if (this.writing.get(asset.id)) { toast('Aguarde: a alteração anterior deste item ainda está sendo salva.'); return false; }
    const before = store.state.assets;
    const de = { status: asset.status, etapa: asset.etapa };
    const restore = () => { buildSecIndex(before); store.set({ assets: before }); };
    const next = { ...asset, ...patch, atualizadoEm: nowIso(), atualizadoPor: store.state.meId || null };
    if (ev) next.historico = [...(asset.historico || []), { data: nowIso(), autorId: store.state.meId || null, autorNome: store.state.authUser?.nome || null, de, para: { status: next.status, etapa: next.etapa }, ...Object.fromEntries(Object.entries(ev).filter(([, v]) => v != null && v !== '')) }];
    const after = [next, ...before.filter(a => a.id !== asset.id)];
    buildSecIndex(after); store.set({ assets: after });
    this.writing.set(asset.id, true);
    try { await this.db.doc('ativos/' + asset.id).set(clean(next)); return true; }
    catch (e) {
      restore();
      const msg = /not_granted|permission|denied|forbidden/i.test(String(e?.code || e?.message)) ? 'Você só tem acesso de leitura a este inventário.' : `Não foi possível salvar: ${e?.message || e}`;
      toast(msg, true); return false;
    } finally { this.writing.delete(asset.id); }
  },
  /** Cadastra o colaborador na lista, se ainda não existir (comparação sem acento e sem caixa). */
  async ensurePerson(nome, projeto) {
    const n = (nome || '').trim().replace(/\s+/g, ' ');
    if (!n || !this.db) return;
    if (store.state.people.some(p => norm(p.nome) === norm(n))) return;
    try { await this.db.collection('colaboradores').add({ nome: n, projeto: projeto || null, origem: 'manual', criadoEm: nowIso(), criadoPor: store.state.authUser?.email || null }); } catch (e) {}
  },
  async addPerson(nome, projeto) {
    const n = (nome || '').trim().replace(/\s+/g, ' ');
    if (!this.db) { toast('Sem conexão com o banco: o colaborador não foi salvo.', true); return false; }
    if (store.state.people.some(p => norm(p.nome) === norm(n))) { toast('Esse colaborador já está na lista.', true); return false; }
    try { await this.db.collection('colaboradores').add({ nome: n, projeto: (projeto || '').trim() || null, origem: 'manual', criadoEm: nowIso(), criadoPor: store.state.authUser?.email || null }); return true; }
    catch (e) { toast(/not_granted|permission|denied|forbidden/i.test(String(e?.code || e?.message)) ? 'Você só tem acesso de leitura a este inventário.' : `Não foi possível salvar: ${e?.message || e}`, true); return false; }
  },
  async updatePerson(p, patch) {
    if (!this.db) return false;
    try { await this.db.doc('colaboradores/' + p.id).update(patch); return true; }
    catch (e) { toast(`Não foi possível salvar: ${e?.message || e}`, true); return false; }
  },
  async removePerson(p) {
    if (!this.db) return false;
    try { await this.db.doc('colaboradores/' + p.id).delete(); return true; }
    catch (e) { toast(`Não foi possível remover: ${e?.message || e}`, true); return false; }
  },
  async create(asset) {
    const id = 'a-' + (crypto.randomUUID?.() || Math.random().toString(36).slice(2)).replace(/-/g, '').slice(0, 12);
    const rec = { ...asset, id, criadoEm: nowIso(), atualizadoEm: nowIso(), atualizadoPor: store.state.meId || null,
      historico: [{ tipo: 'cadastro', data: nowIso(), titulo: 'Cadastrado no sistema', autorId: store.state.meId || null, autorNome: store.state.authUser?.nome || null, para: { status: asset.status, etapa: asset.etapa } }] };
    if (!this.db) { toast('Sem conexão com o banco: o cadastro não foi salvo.', true); return null; }
    try { await this.db.doc('ativos/' + id).set(clean(rec)); const list = [rec, ...store.state.assets]; buildSecIndex(list); store.set({ assets: list }); return rec; }
    catch (e) { toast(`Não foi possível cadastrar: ${e?.message || e}`, true); return null; }
  },
};
