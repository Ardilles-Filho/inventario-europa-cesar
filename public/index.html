  return html`<div class="scrim" onClick=${onClose}></div>
  <aside class="drawer" role="dialog" aria-modal="true" aria-label="Nova licença">
    <div class="drawer-h"><div class="drawer-top"><div><div class="eyebrow">Licenças</div><h1 style=${{ fontSize: '21px', marginTop: '2px' }}>Nova licença</h1></div><button class="btn ghost icon-btn" onClick=${onClose} aria-label="Fechar"><${Icon} n="x" s=${18} /></button></div></div>
    <form class="drawer-b" onSubmit=${submit} noValidate>
      ${LIC_FIELDS.map(f => html`<${Field} f=${f} id=${'ln-' + f.k} value=${v[f.k]} err=${err[f.k]} onInput=${x => setV({ ...v, [f.k]: x })} />`)}
      ${isAdmin() ? html`<${Field} f=${{ k: 'chave', label: 'Chave da licença', help: 'Fica guardada à parte e só administradores veem.' }} id="ln-chave" value=${v.chave} onInput=${x => setV({ ...v, chave: x })} />`
        : html`<p class="muted" style=${{ margin: 0, fontSize: '13px' }}>A chave é cadastrada por um administrador, depois.</p>`}
      <div class="actions"><button class="btn primary" disabled=${busy}>${busy ? 'Salvando…' : 'Cadastrar'}</button><button type="button" class="btn ghost" onClick=${onClose}>Cancelar</button></div>
    </form>
  </aside>`;
}

function ChaveBox({ l }) {
  const chaves = useStore(s => s.chaves);
  const atual = chaves[l.id]?.chave || '';
  const [edit, setEdit] = useState(false); const [v, setV] = useState(''); const [busy, setBusy] = useState(false);
  useEffect(() => { setEdit(false); }, [l.id]);
  const copiar = async () => { try { await navigator.clipboard.writeText(atual); toast('Chave copiada'); } catch (e) { toast('Não foi possível copiar. Selecione e copie manualmente.', true); } };
  const salvar = async e => { e.preventDefault(); setBusy(true); const ok = await Repo.setChave(l, v); setBusy(false); if (ok) { toast(v.trim() ? 'Chave salva' : 'Chave removida'); setEdit(false); } };
  if (edit) return html`<form class="stack" style=${{ gap: '10px' }} onSubmit=${salvar}>
    <${Field} f=${{ k: 'chave', label: 'Chave da licença', help: 'Deixe em branco e salve para remover a chave.' }} id="lc-chave" value=${v} onInput=${setV} />
    <div class="actions"><button class="btn primary" disabled=${busy}>${busy ? 'Salvando…' : 'Salvar chave'}</button><button type="button" class="btn ghost" onClick=${() => setEdit(false)}>Cancelar</button></div></form>`;
  return html`<div class="key-box">${atual ? html`<code class="mono">${atual}</code>` : html`<span class="muted">${l.temChave ? 'Carregando…' : 'Nenhuma chave cadastrada.'}</span>`}
    <div class="actions">${atual && html`<button class="btn sm" onClick=${copiar}>Copiar</button>`}<button class="btn ghost sm" onClick=${() => { setV(atual); setEdit(true); }}>${atual ? 'Alterar' : 'Cadastrar chave'}</button></div></div>`;
}

function LicDrawer({ l, zeevs, openZeev, onClose, onRenew }) {
  const [editing, setEditing] = useState(false);
  const names = useStore(s => s.names); const role = useStore(s => s.role);
  useEffect(() => setEditing(false), [l.id]);
  const s = licStatus(l); const zs = zeevsDaLic(l, zeevs).sort((a, b) => zNum(b) - zNum(a));
  const editor = canEdit();
  const pend = zs.find(z => z.situacao === 'pendente');
  const rows = [['Programa', l.programa], ['Edição ou plano', l.edicao], ['Usuários', (l.usuarios || []).length ? html`${l.usuarios.map(u => html`<div>${u}</div>`)}` : 'Ninguém atribuído'], ['Assentos', String(l.quantidade || 1)], ['Prazo', PRAZO[l.prazo]], ['Expiração', l.expiracao ? `${fmtDay(l.expiracao)} (${licPrazoTxt(l).toLowerCase()})` : licPrazoTxt(l)], ['Origem', l.origem]].filter(([, v]) => v);
  return html`<div class="scrim" onClick=${onClose}></div>
  <aside class="drawer" role="dialog" aria-modal="true" aria-label=${licNome(l)}>
    <div class="drawer-h">
      <div class="drawer-top">
        <div style=${{ display: 'flex', gap: '12px', alignItems: 'center', minWidth: 0 }}><${ProgBadge} p=${l.programa} s=${40} /><div style=${{ minWidth: 0 }}><div class="eyebrow">${l.programa}</div><h1 style=${{ fontSize: '19px', marginTop: '2px' }}>${l.edicao || 'Licença ' + l.programa}</h1></div></div>
        <button class="btn ghost icon-btn" onClick=${onClose} aria-label="Fechar"><${Icon} n="x" s=${18} /></button>
      </div>
      <div class="chips" style=${{ alignItems: 'center' }}><span class=${'pill ' + LIC_ST[s].tone}>${LIC_ST[s].label}</span><span class="muted" style=${{ fontSize: '13px' }}>${s === 'fora' ? 'Funciona sem atualizações' : licPrazoTxt(l)}</span></div>
    </div>
    <div class="drawer-b">
      ${editor && html`<section><div class="section-t"><h2>Próximo passo</h2></div><div class="actions">
        ${pend ? html`<button class="btn" onClick=${() => openZeev(pend.id)}>Ver Zeev ${pend.numero || ''} aberto</button>` : l.prazo !== 'perpetua' && html`<button class="btn primary" onClick=${() => onRenew([l])}>Abrir Zeev de renovação</button>`}
        <button class="btn" onClick=${() => Repo.commitLic(l, { foraDeUso: !l.foraDeUso }, { tipo: 'nota', titulo: l.foraDeUso ? 'Voltou a ser usada' : 'Marcada como fora de uso' }).then(ok => ok && toast('Licença atualizada'))}>${l.foraDeUso ? 'Voltar a usar' : 'Marcar como fora de uso'}</button>
      </div></section>`}
      <section><div class="section-t"><h2>Dados</h2>${editor && html`<button class="btn ghost sm" onClick=${() => setEditing(!editing)}>${editing ? 'Cancelar' : 'Editar'}</button>`}</div>
        ${editing ? html`<${LicForm} l=${l} onDone=${() => setEditing(false)} />` : html`<dl class="dl">${rows.map(([k, v]) => html`<dt>${k}</dt><dd>${v}</dd>`)}</dl>`}</section>
      <section><div class="section-t"><h2>Chave</h2>${role !== 'admin' && html`<span class="muted" style=${{ fontSize: '12.5px' }}><${Icon} n="lock" s=${12} /> só administradores</span>`}</div>
        ${role === 'admin' ? html`<${ChaveBox} l=${l} />` : html`<p class="muted" style=${{ margin: 0, fontSize: '13px' }}>${l.temChave ? 'Esta licença tem chave cadastrada. Peça a um administrador se precisar dela.' : 'Nenhuma chave cadastrada.'}</p>`}</section>
      <section><div class="section-t"><h2>Zeevs</h2><span class="muted num" style=${{ fontSize: '12.5px' }}>${zs.length}</span></div>
        ${zs.length ? html`<div class="sec-list">${zs.map(z => html`<button class="li" onClick=${() => openZeev(z.id)}><span class="znum">${z.numero || 'sem nº'}</span><span style=${{ minWidth: 0 }}><div class="t">${z.descricao || 'Sem descrição'}</div><div class="d">${z.extensoes?.[l.id] && !z.extensoes[l.id].revertido ? 'Renovou até ' + fmtDay(z.extensoes[l.id].para) : z.aprovacao || ''}</div></span><span class=${'pill ' + (ZSIT[z.situacao]?.tone || 'mute')}>${ZSIT[z.situacao]?.label}</span></button>`)}</div>`
          : html`<p class="muted" style=${{ margin: 0, fontSize: '13px' }}>Nenhum Zeev ligado a esta licença.</p>`}</section>
      <section><div class="section-t"><h2>Histórico</h2><span class="muted num" style=${{ fontSize: '12.5px' }}>${(l.historico || []).length} registros</span></div>
        <ol class="timeline">${[...(l.historico || [])].reverse().map(e => html`<li><span class=${'dot ' + e.tipo}></span><div style=${{ minWidth: 0 }}><div class="tt">${e.titulo}</div><div class="tm">${fmtDate(e.data)} · ${authorName(e, names)}</div>${e.texto && html`<div class="tx">${e.texto}</div>`}</div></li>`)}</ol></section>
    </div>
  </aside>`;
}

/** Seleção de licenças dentro do formulário de Zeev. */
function LicPicker({ value, onChange }) {
  const licencas = useStore(s => s.licencas);
  const [q, setQ] = useState('');
  const sel = new Set(value || []);
  const lista = useMemo(() => { const w = norm(q).split(/\s+/).filter(Boolean); return licencas.filter(l => w.every(x => (l._hay ||= licHay(l)).includes(x))).sort((a, b) => a.programa.localeCompare(b.programa, 'pt-BR') || (a.expiracao || '9').localeCompare(b.expiracao || '9')); }, [licencas, q]);
  const toggle = id => onChange(sel.has(id) ? [...sel].filter(x => x !== id) : [...sel, id]);
  const escolhidas = licencas.filter(l => sel.has(l.id));
  return html`<div class="field"><label for="lic-busca">Licenças que este Zeev renova</label>
    ${escolhidas.length > 0 && html`<div class="chips">${escolhidas.map(l => html`<button type="button" class="chip" aria-pressed="true" onClick=${() => toggle(l.id)} title="Remover"><${ProgBadge} p=${l.programa} s=${16} />${licNome(l)} · ${fmtDay(l.expiracao)} ×</button>`)}</div>`}
    <input id="lic-busca" type="search" placeholder="Buscar licença por programa, edição ou data" value=${q} onInput=${e => setQ(e.target.value)} />
    <div class="lic-pick">${lista.slice(0, 60).map(l => html`<label class="lic-opt"><input type="checkbox" checked=${sel.has(l.id)} onChange=${() => toggle(l.id)} /><${ProgBadge} p=${l.programa} s=${20} /><span class="t">${licNome(l)}${l.usuarios?.length ? html`<span class="muted"> · ${usuariosTxt(l)}</span>` : ''}</span><span class="muted num">${l.quantidade > 1 ? l.quantidade + ' assentos · ' : ''}${l.expiracao ? fmtDay(l.expiracao) : PRAZO[l.prazo]}</span></label>`)}
      ${lista.length > 60 && html`<div class="muted" style=${{ padding: '8px 10px', fontSize: '12.5px' }}>Mostrando 60 de ${lista.length}. Refine a busca.</div>`}</div>
    <span class="muted" style=${{ fontSize: '12px' }}>Quando o Zeev for aprovado, cada licença marcada ganha mais um ano a partir da expiração atual.</span>
  </div>`;
}

function LicNudge() {
  const licencas = useStore(s => s.licencas);
  const n = licencas.filter(l => licStatus(l) === 'vence').reduce((s, l) => s + (l.quantidade || 1), 0);
  if (!n) return null;
  return html`<div class="banner"><b>${n} ${n === 1 ? 'licença vence' : 'licenças vencem'} nos próximos 30 dias.</b><span>Veja em Licenças → Renovações do mês e abra o Zeev de renovação. <a href="#licencas">Abrir licenças</a></span></div>`;
}

/* ---------------- Administração: acessos e backup ---------------- */
const diasDesde = iso => iso ? Math.floor((Date.now() - new Date(iso).getTime()) / 864e5) : null;
function BackupNudge() {
  const { role, backupInfo } = useStore(s => s);
  if (role !== 'admin') return null;
  const d = diasDesde(backupInfo?.ultimo);
  if (d != null && d < BACKUP_DIAS) return null;
  return html`<div class="banner"><b>${d == null ? 'Nenhum backup feito ainda.' : `Último backup há ${d} dias.`}</b><span>Baixe um backup por semana para não perder dados se algo for apagado por engano. <a href="#admin">Fazer backup agora</a></span></div>`;
}

function Admin() {
  const { authUser, assets, people, zeevs, licencas, backupInfo } = useStore(s => s);
  const me = (authUser.email || '').toLowerCase();
  const dom = window.DOMINIO_PERMITIDO || '';
  const [acessos, setAcessos] = useState(null);
  const [loadErr, setLoadErr] = useState(null);
  const [f, setF] = useState({ email: '', nome: '', papel: 'editor' });
  const [err, setErr] = useState('');
  const [busy, setBusy] = useState(false);
  const [confirmId, setConfirmId] = useState(null);
  const [arquivo, setArquivo] = useState(null);
  const [restoreMsg, setRestoreMsg] = useState('');
  const [restoring, setRestoring] = useState(false);
  const [confirmRestore, setConfirmRestore] = useState(false);

  useEffect(() => {
    if (!Repo.db) return;
    const unsub = Repo.db.collection('acessos').onSnapshot(
      snap => setAcessos(docsFrom(snap).sort((x, y) => (x.nome || x.id).localeCompare(y.nome || y.id, 'pt-BR'))),
      e => setLoadErr(e?.message || String(e)));
    return unsub;
  }, []);

  const liberar = async e => {
    e.preventDefault();
    const email = f.email.trim().toLowerCase();
    if (!/^[^@\s]+@[^@\s]+$/.test(email)) { setErr('Informe um e-mail válido.'); return; }
    if (dom && !email.endsWith('@' + dom)) { setErr(`Use um e-mail @${dom}.`); return; }
    if (acessos?.some(a => a.id === email)) { setErr('Esse e-mail já tem acesso. Mude o papel na lista abaixo.'); return; }
    setErr(''); setBusy(true);
    const ok = await Repo.setAccess(email, { papel: f.papel, nome: f.nome.trim() || null, criadoEm: nowIso(), criadoPor: authUser.email });
    setBusy(false);
    if (ok) { toast(`Acesso liberado para ${email}`); setF({ email: '', nome: '', papel: 'editor' }); }
  };
  const mudarPapel = async (a, papel) => { if (await Repo.setAccess(a.id, { papel, alteradoEm: nowIso(), alteradoPor: authUser.email })) toast(`${a.nome || a.id} agora é ${PAPEIS[papel].label.toLowerCase()}`); };
  const remover = async a => { if (confirmId !== a.id) { setConfirmId(a.id); return; } setConfirmId(null); if (await Repo.removeAccess(a.id)) toast(`Acesso removido: ${a.id}`); };

  const baixar = async () => { const nome = await Repo.backup(acessos); toast(`Backup baixado: ${nome}`); };
  const escolher = async e => {
    const file = e.target.files?.[0]; e.target.value = ''; setConfirmRestore(false); setRestoreMsg('');
    if (!file) return;
    try {
      const d = JSON.parse(await file.text());
      const ok = Array.isArray(d.ativos) && Array.isArray(d.colaboradores) && d.ativos.every(a => a && a.id && !String(a.id).includes('/')) && d.colaboradores.every(c => c && c.id && !String(c.id).includes('/')) && ['zeevs', 'licencas', 'licencasChaves'].every(k => d[k] == null || (Array.isArray(d[k]) && d[k].every(x => x && x.id && !String(x.id).includes('/'))));
      if (!ok) throw new Error('formato');
      setArquivo({ nome: file.name, dados: d });
    } catch (x) { setArquivo(null); setRestoreMsg('Esse arquivo não é um backup do inventário. Use o arquivo .json gerado pelo botão “Baixar backup”.'); }
  };
  const restaurar = async () => {
    if (!confirmRestore) { setConfirmRestore(true); return; }
    setRestoring(true); setRestoreMsg('Restaurando…');
    try {
      const n = await Repo.restore(arquivo.dados, (i, t) => setRestoreMsg(`Gravando… ${i} de ${t}`));
      setRestoreMsg(`Backup restaurado: ${n} registros gravados.`); setArquivo(null);
    } catch (e) { setRestoreMsg(`A restauração parou: ${e?.message || e}. Tente de novo; o que já foi gravado não duplica.`); }
    setRestoring(false); setConfirmRestore(false);
  };
  const d = diasDesde(backupInfo?.ultimo);
  const admins = (acessos || []).filter(a => a.papel === 'admin').length;

  return html`
    <${PageHead} title="Administração" sub="Quem pode usar o inventário e cópias de segurança dos dados. Só administradores veem esta página." />
    <div class="admin-grid">
      <section class="panel">
        <div class="panel-h"><h2>Acessos</h2><span class="muted num">${acessos ? acessos.length + ' pessoas' : ''}</span></div>
        <div class="panel-b stack">
          <ul class="roles-help">${Object.entries(PAPEIS).map(([k, p]) => html`<li><b>${p.label}</b>: ${p.desc}.</li>`)}</ul>
          <form class="access-form" onSubmit=${liberar} noValidate>
            <div class="field"><label for="ac-email">E-mail *</label><input id="ac-email" type="email" autocomplete="off" placeholder=${'nome@' + (dom || 'empresa.com')} value=${f.email} onInput=${e => { setF({ ...f, email: e.target.value }); setErr(''); }} />${err && html`<span class="err">${err}</span>`}</div>
            <div class="field"><label for="ac-nome">Nome</label><input id="ac-nome" list="dl-pessoas" autocomplete="off" value=${f.nome} onInput=${e => setF({ ...f, nome: e.target.value })} /></div>
            <div class="field"><label for="ac-papel">Papel</label><select id="ac-papel" value=${f.papel} onChange=${e => setF({ ...f, papel: e.target.value })}>${Object.entries(PAPEIS).map(([k, p]) => html`<option value=${k}>${p.label}</option>`)}</select></div>
            <button class="btn primary" disabled=${busy}><${Icon} n="plus" />${busy ? 'Salvando…' : 'Liberar acesso'}</button>
          </form>
        </div>
        ${loadErr ? html`<div class="panel-b"><div class="banner"><b>Não foi possível carregar os acessos.</b><span>${loadErr}</span></div></div>` : !acessos ? html`<div class="panel-b"><div class="skeleton"></div></div>` : html`
        <div class="table-wrap" style=${{ border: 0, borderTop: '1px solid var(--line)', borderRadius: 0 }}>
          <table>
            <thead><tr><th>Pessoa</th><th>Papel</th><th>Liberado em</th><th></th></tr></thead>
            <tbody>${acessos.map(a => html`<tr key=${a.id}>
              <td><div class="t">${a.nome || a.id}${a.id === me ? ' (você)' : ''}</div>${a.nome && html`<div class="sub">${a.id}</div>`}</td>
              <td>${a.id === me ? html`<span>${PAPEIS[a.papel]?.label || a.papel}</span>` : html`<select aria-label=${'Papel de ' + (a.nome || a.id)} value=${a.papel} onChange=${e => mudarPapel(a, e.target.value)}>${Object.entries(PAPEIS).map(([k, p]) => html`<option value=${k}>${p.label}</option>`)}</select>`}</td>
              <td class="muted num">${fmtDate(a.criadoEm)}</td>
              <td>${a.id !== me && html`<div class="actions-inline"><button class=${'btn sm ' + (confirmId === a.id ? 'danger' : 'ghost')} onClick=${() => remover(a)} onBlur=${() => setConfirmId(c => c === a.id ? null : c)} aria-label=${'Remover acesso de ' + (a.nome || a.id)}>${confirmId === a.id ? 'Confirmar remoção' : html`<${Icon} n="trash" />`}</button></div>`}</td>
            </tr>`)}</tbody>
          </table>
        </div>
        <div class="panel-b"><p class="muted" style=${{ margin: 0, fontSize: '12.5px' }}>Você não pode mudar o próprio papel nem se remover, para a equipe não ficar sem administrador.${admins < 2 ? ' Vale ter pelo menos dois administradores, por exemplo você e seu gestor.' : ''}</p></div>`}
      </section>

      <section class="panel">
        <div class="panel-h"><h2>Backup</h2><span class=${'pill ' + (d != null && d < BACKUP_DIAS ? 'ok' : 'warn')}>${d == null ? 'nunca feito' : d === 0 ? 'feito hoje' : `há ${d} dias`}</span></div>
        <div class="panel-b stack">
          <p style=${{ margin: 0 }}>O backup baixa um arquivo com os ${assets.length} equipamentos, os ${people.length} colaboradores, os ${zeevs.length} Zeevs, as ${licencas.length} licenças (com as chaves) e a lista de acessos. Guarde em um lugar seguro da empresa, como o drive da equipe, porque ele tem dados pessoais. Recomendado: uma vez por semana.</p>
          ${backupInfo?.ultimo && html`<p class="muted" style=${{ margin: 0, fontSize: '13px' }}>Último backup: ${fmtDate(backupInfo.ultimo)}, por ${backupInfo.por || 'alguém da equipe'}.</p>`}
          <div class="backup-row"><button class="btn primary" onClick=${baixar} disabled=${!assets.length}><${Icon} n="down" />Baixar backup</button></div>
        </div>
        <div class="panel-b stack" style=${{ borderTop: '1px solid var(--line)' }}>
          <h3>Restaurar um backup</h3>
          <p class="muted" style=${{ margin: 0, fontSize: '13px' }}>Grava de volta os equipamentos, colaboradores, Zeevs e licenças do arquivo, substituindo os que têm o mesmo código. Itens criados depois do backup continuam como estão. A lista de acessos não é restaurada.</p>
          <div class="backup-row">
            <label class="btn file-pick"><${Icon} n="upload" />Escolher arquivo<input type="file" accept=".json,application/json" onChange=${escolher} /></label>
            ${arquivo && html`<span class="muted" style=${{ fontSize: '13px' }}>${arquivo.nome}: ${arquivo.dados.parcial ? 'atualização parcial (só completa campos de itens que já existem): ' : ''}${arquivo.dados.ativos.length} equipamentos, ${arquivo.dados.colaboradores.length} colaboradores, ${(arquivo.dados.zeevs || []).length} Zeevs e ${(arquivo.dados.licencas || []).length} licenças${arquivo.dados.geradoEm ? `, de ${fmtDate(arquivo.dados.geradoEm)}` : ''}.</span>`}
          </div>
          ${arquivo && html`<div class="backup-row"><button class=${'btn ' + (confirmRestore ? 'danger' : 'primary')} onClick=${restaurar} disabled=${restoring}>${restoring ? 'Restaurando…' : confirmRestore ? 'Confirmar: substituir pelos dados do arquivo' : 'Restaurar backup'}</button>${confirmRestore && !restoring && html`<button class="btn ghost" onClick=${() => setConfirmRestore(false)}>Cancelar</button>`}</div>`}
          ${restoreMsg && html`<p role="status" style=${{ margin: 0, fontSize: '13px' }}>${restoreMsg}</p>`}
        </div>
      </section>
    </div>`;
}

/* ================================================================
   5. BOOT
   ================================================================ */
render(html`<${App} />`, document.getElementById('app'));
Repo.init();
</script>

</body></html>
