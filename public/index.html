    <${PageHead} title="Painel" sub=${`${m.act.length} equipamentos ativos. Os números se atualizam sozinhos quando alguém muda um item.`} />
    <section class="kpis" aria-label="Indicadores">
      <button class="kpi accent" onClick=${() => toInv('disponivel')}><span class="l">Prontos para entrega</span><span class="v">${m.ready.length}</span><span class="s">${m.readyByCat.map(([k, n]) => `${n} ${CATEG[k].toLowerCase()}`).join(' · ') || 'nenhum'}</span></button>
      <button class="kpi" onClick=${() => toInv('colaborador')}><span class="l">Com colaboradores</span><span class="v">${m.withPeople.length}</span><span class="s">alocados ou emprestados</span></button>
      <button class="kpi" onClick=${() => go('reparos')}><span class="l">No fluxo de reparo</span><span class="v">${m.repair.length}</span><span class="s">${fmtMoney(m.repair.reduce((t, a) => t + (a.reparo?.orcamento || 0), 0))} em orçamentos</span></button>
      <button class="kpi" onClick=${() => toInv('danificado suporte')}><span class="l">Aguardando triagem</span><span class="v">${m.triage.length}</span><span class="s">danificados parados no suporte</span></button>
      <button class="kpi" onClick=${() => toInv('reservado')}><span class="l">Reservados</span><span class="v">${m.act.filter(a => a.status === 'reservado').length}</span><span class="s">esperando entrega</span></button>
    </section>
    <div class="dash">
      <div class="stack">
        <section class="panel">
          <div class="panel-h"><h2>Parque por tipo e status</h2><span class="muted num">${m.act.length} ativos</span></div>
          <div class="panel-b stack">
            <div class="bars">
              ${m.byCat.map(c => html`<div class="bar-row" role="button" tabindex="0" onClick=${() => toInv(c.k)} onKeyDown=${e => e.key === 'Enter' && toInv(c.k)}>
                <span class="lbl">${CATEG[c.k]}</span>
                <span class="bar-track" style=${{ width: (c.n / maxCat * 100) + '%' }} title=${Object.entries(c.by).map(([s, n]) => `${STATUS[s].label}: ${n}`).join(' · ')}>
                  ${Object.keys(STATUS).filter(s => c.by[s]).map(s => html`<span class=${'c-' + s} style=${{ width: (c.by[s] / c.n * 100) + '%' }}></span>`)}
                </span>
                <span class="tot">${c.n}</span></div>`)}
            </div>
            <div class="legend">${Object.keys(STATUS).filter(s => s !== 'baixado').map(s => html`<span><i class=${'c-' + s}></i>${STATUS[s].label}</span>`)}</div>
          </div>
        </section>
        <section class="stack" style=${{ gap: '10px' }}>
          <div class="section-t"><h2>Fluxo de reparo</h2><a class="btn ghost sm" href="#reparos">Abrir quadro</a></div>
          <div class="pipe">
            ${m.pipe.map(p => html`<button onClick=${() => go('reparos')}><span class="l">${ETAPA[p.s].label}</span><span class="v">${p.n}</span><span class="s">${p.total ? fmtMoney(p.total) : ' '}${p.late ? html` · <span style=${{ color: 'var(--bad)' }}>${p.late} parados</span>` : ''}</span></button>`)}
          </div>
        </section>
      </div>
      <div class="stack">
        <section class="panel">
          <div class="panel-h"><h2>Precisa de atenção</h2><a class="btn ghost sm" href="#qualidade">Ver todas</a></div>
          <div class="list">
            ${m.alerts.slice(0, 7).map(({ a, c }) => html`<button class="li" onClick=${() => open(a.id)}><span class=${'sev ' + c.sev}></span><span style=${{ minWidth: 0 }}><div class="t">${assetName(a)} <span class="mono muted">${assetCode(a)}</span></div><div class="d">${c.title}: ${c.detail(a)}</div></span><${StatusPill} s=${a.status} /></button>`)}
            ${!m.alerts.length && html`<div class="empty">Nada parado. Bom trabalho.</div>`}
          </div>
        </section>
        <section class="panel">
          <div class="panel-h"><h2>Atividade recente</h2></div>
          <div class="list">
            ${m.events.map(({ e, a }) => html`<button class="li" onClick=${() => open(a.id)}><span class="avatar">${initials(authorName(e, names))}</span><span style=${{ minWidth: 0 }}><div class="t">${e.titulo}</div><div class="d">${assetName(a)} · ${assetCode(a)} · ${authorName(e, names)}</div></span><span class="muted" style=${{ fontSize: '12px' }}>${fmtDate(e.data)}</span></button>`)}
            ${!m.events.length && html`<div class="empty" style=${{ padding: '24px' }}>As movimentações feitas no sistema (entregas, devoluções, reparos) aparecem aqui.</div>`}
          </div>
        </section>
      </div>
    </div>`;
}
const authorName = (e, names) => e.autorNome || (e.autorId ? (names[e.autorId] || 'Alguém da equipe') : (e.autor || 'Planilha'));
const initials = n => (n || '?').split(/\s+/).filter(w => w.length > 1).slice(0, 2).map(w => w[0].toUpperCase()).join('') || '·';
const PageHead = ({ title, sub, children }) => html`<div class="page-head"><div><h1>${title}</h1>${sub && html`<p>${sub}</p>`}</div>${children}</div>`;

/* ---------------- Inventário ---------------- */
const COLS = [
  ['tombamento', 'Tombamento'], ['tipo', 'Equipamento'], ['status', 'Status'], ['etapa', 'Onde está'], ['pessoa', 'Com / para'], ['serial', 'Serial'], ['atualizadoEm', 'Atualizado'],
];
function Inventory({ assets, open, query, setQuery }) {
  const [cat, setCat] = useState('todos');
  const [showBaixados, setShowBaixados] = useState(false);
  const [sort, setSort] = useState(['atualizadoEm', -1]);
  const [limit, setLimit] = useState(60);
  const parsed = useMemo(() => parseQuery(query), [query]);
  const base = useMemo(() => assets.filter(a => (showBaixados || a.status !== 'baixado')), [assets, showBaixados]);
  const searched = useMemo(() => applySearch(base, parsed), [base, parsed]);
  const counts = useMemo(() => { const c = { todos: searched.length, secundarias: 0 }; searched.forEach(a => { c[a.categoria] = (c[a.categoria] || 0) + 1; if (isSecondary(a)) c.secundarias++; }); return c; }, [searched]);
  const rows = useMemo(() => {
    const r = cat === 'todos' ? searched : cat === 'secundarias' ? searched.filter(isSecondary) : searched.filter(a => a.categoria === cat);
    const [k, dir] = sort;
    const val = a => k === 'pessoa' ? (a.responsavel || a.reservadoPara || '') : k === 'status' ? Object.keys(STATUS).indexOf(a.status) : k === 'etapa' ? (ETAPA[a.etapa]?.label || '') : (a[k] ?? '');
    return [...r].sort((x, y) => { const a = val(x), b = val(y); if (a === b) return 0; if (a === '' || a == null) return 1; if (b === '' || b == null) return -1; return (a > b ? 1 : -1) * dir; });
  }, [searched, cat, sort]);
  useEffect(() => setLimit(60), [query, cat]);
  const flagIds = useMemo(() => new Set(assets.filter(a => CHECKS.some(c => (c.sev === 'bad' || c.sev === 'warn') && c.test(a))).map(a => a.id)), [assets]);
  const removeFilter = f => {
    const words = norm(query).split(/\s+/).filter(t => { const h = VOCAB_MAP.get(t); return !(h && h.k === f.k && h.v === f.v); });
    let q = words.join(' ');
    if (f.k === 'flag') q = q.replace(/sem serial|sem tombamento|sem tomb|parados?|sem apex ?one|sem apex/g, '').trim();
    setQuery(q);
  };
  const exportCsv = async () => {
    const cols = ['tombamento', 'serial', 'imei', 'categoria', 'tipo', 'configuracao', 'status', 'etapa', 'responsavel', 'projeto', 'secundarias', 'principal', 'reservadoPara', 'antigoDono', 'aprovador', 'centroCusto', 'apexone', 'fornecedor', 'observacoes', 'atualizadoEm'];
    const esc = v => { const s = v == null ? '' : String(v); return /[";\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s; };
    const csv = '﻿' + [cols.join(';'), ...rows.map(a => cols.map(c => esc(c === 'status' ? STATUS[a[c]]?.label : c === 'etapa' ? ETAPA[a[c]]?.label : c === 'secundarias' ? (a.secundarias || []).join(' / ') : c === 'principal' ? (primaryOf(a)?.tombamento || a.principalExterna) : a[c])).join(';'))].join('\n');
    const url = URL.createObjectURL(new Blob([csv], { type: 'text/csv;charset=utf-8' }));
    const link = document.createElement('a'); link.href = url; link.download = `inventario-apple-${today()}.csv`;
    document.body.appendChild(link); link.click(); link.remove(); setTimeout(() => URL.revokeObjectURL(url), 2000);
  };

  return html`
    <${PageHead} title="Inventário" sub="Todos os equipamentos em um só lugar. A busca entende termos como “iphone danificado”, “m1 disponível”, “parados” ou “sem serial”.">
      <button class="btn" onClick=${exportCsv} disabled=${!rows.length}><${Icon} n="down" />Exportar CSV</button>
    <//>
    <div class="filters">
      ${parsed.filters.length > 0 && html`<div class="chips" aria-label="Filtros entendidos da busca">
        <span class="muted" style=${{ fontSize: '12.5px', alignSelf: 'center' }}>Entendi:</span>
        ${parsed.filters.map(f => html`<span class="qchip">${FILTER_LABEL[f.k]}: ${valueLabel(f.k, f.v)}<button aria-label="Remover filtro" onClick=${() => removeFilter(f)}>×</button></span>`)}
        ${parsed.words.length > 0 && html`<span class="qchip">Texto: ${parsed.words.join(' ')}</span>`}
      </div>`}
      <div class="toolbar">
        <div class="chips" role="group" aria-label="Tipo de equipamento">
          ${['todos', ...Object.keys(CATEG), 'secundarias'].filter(k => k === 'todos' || counts[k]).map(k => html`<button class="chip" aria-pressed=${cat === k} onClick=${() => setCat(k)}>${k === 'todos' ? 'Todos' : k === 'secundarias' ? 'Máquinas secundárias' : CATEG[k]}<span class="n">${counts[k] || 0}</span></button>`)}
        </div>
        <label class="chip" style=${{ cursor: 'pointer' }}><input id="mostrar-baixados" type="checkbox" checked=${showBaixados} onChange=${e => setShowBaixados(e.target.checked)} /> Mostrar baixados</label>
      </div>
    </div>
    ${!assets.length ? html`<${EmptyState} />` : !rows.length ? html`<div class="panel empty"><h2>Nada encontrado</h2><p>Nenhum equipamento combina com “${query}”. Tente o tombamento com 6 dígitos, parte do serial ou o nome da pessoa.</p><button class="btn" onClick=${() => { setQuery(''); setCat('todos'); }}>Limpar busca</button></div>` : html`
    <div class="table-wrap">
      <table>
        <thead><tr>${COLS.map(([k, l]) => html`<th aria-sort=${sort[0] === k ? (sort[1] > 0 ? 'ascending' : 'descending') : null}><button onClick=${() => setSort([k, sort[0] === k ? -sort[1] : 1])}>${l}${sort[0] === k ? (sort[1] > 0 ? ' ↑' : ' ↓') : ''}</button></th>`)}</tr></thead>
        <tbody>
          ${rows.slice(0, limit).map(a => html`<tr key=${a.id} onClick=${() => open(a.id)} tabindex="0" onKeyDown=${e => e.key === 'Enter' && open(a.id)}>
            <td class="mono">${a.tombamento || html`<span class="muted">—</span>`}${flagIds.has(a.id) && html`<span class="flag" title="Tem pendência"></span>`}</td>
            <td><div class="t">${assetName(a)}</div><div class="sub">${[a.configuracao, a.ano].filter(Boolean).join(' · ') || CATEG_ONE[a.categoria]}</div></td>
            <td><${StatusPill} s=${a.status} /></td>
            <td><${Stage} a=${a} />${isRepair(a) && a.fornecedor && html`<div class="sub">${a.fornecedor}</div>`}</td>
            <td>${a.responsavel || (a.reservadoPara ? html`<span class="muted">para </span>${a.reservadoPara}` : html`<span class="muted">—</span>`)}${(a.projeto || isSecondary(a)) && html`<div class="sub">${[isSecondary(a) && 'secundária', a.projeto].filter(Boolean).join(' · ')}</div>`}</td>
            <td class="mono">${a.serial || (a.imei ? html`<span class="muted">IMEI </span>${a.imei}` : html`<span class="muted">—</span>`)}</td>
            <td class="muted num" style=${{ whiteSpace: 'nowrap' }}>${fmtDate(a.atualizadoEm)}</td>
          </tr>`)}
        </tbody>
      </table>
      ${rows.length > limit && html`<div class="more"><button class="btn" onClick=${() => setLimit(limit + 100)}>Mostrar mais (${rows.length - limit} restantes)</button></div>`}
    </div>
    <div class="muted num" style=${{ fontSize: '12.5px' }}>${rows.length} de ${base.length} equipamentos</div>`}`;
}

/* ---------------- Reparos (quadro) ---------------- */
function Repairs({ assets, open }) {
  const cols = useMemo(() => REPAIR_STAGES.map(s => ({ s, items: assets.filter(a => a.etapa === s).map(a => ({ a, d: daysSince(stageSince(a)) })).sort((x, y) => (y.d ?? -1) - (x.d ?? -1)) })), [assets]);
  const total = cols.reduce((t, c) => t + c.items.length, 0);
  const spend = assets.filter(isRepair).reduce((t, a) => t + (a.reparo?.orcamento || 0), 0);
  return html`
    <${PageHead} title="Reparos" sub=${`${total} equipamentos entre orçamento e retirada, somando ${fmtMoney(spend)} em orçamentos. Abra um cartão para avançar a etapa.`} />
    ${!assets.length ? html`<${EmptyState} />` : html`
    <div class="board">
      ${cols.map(c => html`<section class="col" aria-label=${ETAPA[c.s].label}>
        <div class="col-h"><h3>${ETAPA[c.s].label}</h3><span class="n">${c.items.length}${c.items.some(x => x.a.reparo?.orcamento) ? ' · ' + fmtMoney(c.items.reduce((t, x) => t + (x.a.reparo?.orcamento || 0), 0)) : ''}</span></div>
        ${c.items.map(({ a, d }) => html`<button class="card" onClick=${() => open(a.id)}>
          <div class="row"><span class="t" style=${{ fontWeight: 500 }}>${assetName(a)}</span><span class="mono muted">${a.tombamento || ''}</span></div>
          <div class="muted" style=${{ fontSize: '12.5px', overflow: 'hidden', textOverflow: 'ellipsis', whiteSpace: 'nowrap', maxWidth: '100%' }}>${a.reparo?.defeito || a.observacoes || 'Defeito não descrito'}</div>
          <div class="row"><span style=${{ fontSize: '12px' }}>${a.fornecedor || 'Assistência?'}${a.reparo?.os ? html` · <span class="mono">OS ${a.reparo.os}</span>` : ''}</span>
            <span class=${'age' + (d > STALE_DAYS ? ' late' : '')}>${d == null ? 'sem data' : d === 0 ? 'hoje' : d + ' d'}</span></div>
          ${(a.reparo?.orcamento || a.reparo?.cobertura) && html`<div style=${{ fontSize: '12.5px' }}>${a.reparo.cobertura ? html`<span class="pill plain info">${a.reparo.cobertura}</span>` : html`<span class="num">${fmtMoney(a.reparo.orcamento)}</span>`}</div>`}
        </button>`)}
        ${!c.items.length && html`<div class="muted" style=${{ fontSize: '12.5px', padding: '8px 4px' }}>Nenhum equipamento nesta etapa.</div>`}
      </section>`)}
    </div>`}`;
}

/* ---------------- Pendências / qualidade ---------------- */
function Quality({ assets, open }) {
  const meta = useStore(s => s.meta);
  const groups = useMemo(() => CHECKS.map(c => ({ c, items: assets.filter(c.test) })).filter(g => g.items.length), [assets]);
  const [expanded, setExpanded] = useState({});
  return html`
    <${PageHead} title="Pendências" sub="Regras automáticas que apontam equipamentos parados, cadastros incompletos e dados que precisam de confirmação. Corrija abrindo o item." />
    ${meta && html`<p class="prov">Importado de “${meta.arquivo}” em ${fmtDate(meta.data)}: ${meta.linhasLidas} linhas lidas de ${meta.abas} abas, ${meta.duplicatas} duplicatas mescladas, ${meta.ativos} ativos, ${meta.eventos} eventos de histórico (abas Garantia e Arquivo).</p>`}
    ${!assets.length ? html`<${EmptyState} />` : html`
    <div class="qgroups">
      ${groups.map(({ c, items }) => html`<section class="panel">
        <div class="panel-h" style=${{ alignItems: 'flex-start' }}><div><h2>${c.title}</h2><div class="muted" style=${{ fontSize: '12.5px', marginTop: '2px' }}>${c.hint}</div></div><span class=${'pill ' + (c.sev === 'bad' ? 'bad' : c.sev === 'warn' ? 'warn' : c.sev === 'info' ? 'info' : 'mute')}>${items.length}</span></div>
        <div class="list">
          ${items.slice(0, expanded[c.id] ? 999 : 6).map(a => html`<button class="li" onClick=${() => open(a.id)}><span class=${'sev ' + c.sev}></span><span style=${{ minWidth: 0 }}><div class="t">${assetName(a)} <span class="mono muted">${assetCode(a)}</span></div><div class="d">${c.detail(a)}</div></span><${StatusPill} s=${a.status} /></button>`)}
        </div>
        ${items.length > 6 && html`<div class="more" style=${{ borderTop: '1px solid var(--line)' }}><button class="btn ghost sm" onClick=${() => setExpanded({ ...expanded, [c.id]: !expanded[c.id] })}>${expanded[c.id] ? 'Mostrar menos' : `Ver todos os ${items.length}`}</button></div>`}
      </section>`)}
    </div>`}`;
}

/* ---------------- Gaveta de detalhe ---------------- */
function Drawer({ asset: a, onClose, open }) {
  const [act, setAct] = useState(null);
  const [editing, setEditing] = useState(false);
  const names = useStore(s => s.names);
  useEffect(() => { setAct(null); setEditing(false); }, [a.id]);
  useEffect(() => { Repo.resolveNames((a.historico || []).map(e => e.autorId).concat(a.atualizadoPor)); }, [a.id, a.historico?.length]);
  const actions = ACTIONS.filter(x => x.when(a));
  const issues = CHECKS.filter(c => c.test(a));
  const hist = [...(a.historico || [])].reverse();
  const since = stageSince(a);
  const rows = [
    ['Tipo', CATEG_ONE[a.categoria]], ['Configuração', a.configuracao], ['Chip', a.chip], ['Ano', a.ano],
    ['Com', a.responsavel], ['Reservado para', a.reservadoPara], ['Antigo dono', a.antigoDono], ['Aprovador / gerente', a.aprovador],
    ['Projeto', a.projeto], ['Centro de custo', a.centroCusto], ['Agente Apex One', a.apexone], ['Tombamentos anteriores', (a.tombamentosAnteriores || []).join(', ')],
    ['Observações', a.observacoes],
  ].filter(([, v]) => v != null && v !== '');
  const allAssets = useStore(s => s.assets);
  const secs = (a.secundarias || []).map(t => ({ t, x: allAssets.find(y => y.tombamento === t) }));
  const prim = primaryOf(a);
  const rp = a.reparo || {};
  const rrows = [['Assistência', a.fornecedor], ['Defeito', rp.defeito], ['Orçamento', rp.orcamento != null ? fmtMoney(rp.orcamento) : null], ['Cobertura', rp.cobertura], ['O.S.', rp.os], ['Chamado Zeev', rp.chamado], ['Nota fiscal', rp.nf], ['Entrada', rp.entrada && fmtDate(rp.entrada)], ['Retorno', rp.retorno && fmtDate(rp.retorno)], ['Comentário', rp.comentario]].filter(([, v]) => v != null && v !== '');

  return html`
  <div class="scrim" onClick=${onClose}></div>
  <aside class="drawer" role="dialog" aria-modal="true" aria-label=${assetName(a)}>
    <div class="drawer-h">
      <div class="drawer-top">
        <div style=${{ minWidth: 0 }}><div class="eyebrow">${CATEG_ONE[a.categoria]}</div><h1 style=${{ fontSize: '21px', marginTop: '2px' }}>${assetName(a)}</h1></div>
        <button class="btn ghost icon-btn" onClick=${onClose} aria-label="Fechar"><${Icon} n="x" s=${18} /></button>
      </div>
      <div class="ids mono">
        <span><b>Tomb.</b>${a.tombamento || '—'}</span><span><b>S/N</b>${a.serial || '—'}</span>${a.imei && html`<span><b>IMEI</b>${a.imei}</span>`}
      </div>
      <div class="chips" style=${{ alignItems: 'center' }}><${StatusPill} s=${a.status} /><span class="pill plain">${ETAPA[a.etapa]?.label}</span>${since && html`<span class="muted" style=${{ fontSize: '12.5px' }}>desde ${fmtDate(since)} (${daysSince(since)} dias)</span>`}</div>
    </div>
    <div class="drawer-b">
      ${issues.length > 0 && html`<div class="stack" style=${{ gap: '6px' }}>${issues.map(c => html`<div class="banner" style=${{ padding: '8px 12px', background: c.sev === 'bad' ? 'var(--bad-soft)' : c.sev === 'mute' ? 'var(--mute-soft)' : c.sev === 'info' ? 'var(--info-soft)' : 'var(--warn-soft)' }}><b style=${{ color: c.sev === 'bad' ? 'var(--bad)' : c.sev === 'info' ? 'var(--info)' : c.sev === 'mute' ? 'var(--fg-2)' : 'var(--warn)' }}>${c.title}.</b><span>${c.hint}</span></div>`)}</div>`}
      <section>
        <div class="section-t"><h2>Próximo passo</h2></div>
        ${act ? html`<${ActionForm} action=${act} asset=${a} onDone=${() => setAct(null)} />` : html`
        <div class="actions">${actions.map(x => html`<button class=${'btn' + (x.primary ? ' primary' : '') + (x.danger ? ' danger' : '')} onClick=${() => x.fields ? setAct(x) : Repo.commit(a, x.apply(a, {}), x.event(a, {})).then(ok => ok && toast(x.label + ': feito'))}>${x.label}</button>`)}</div>`}
      </section>
      <section>
        <div class="section-t"><h2>Dados</h2><button class="btn ghost sm" onClick=${() => setEditing(!editing)}>${editing ? 'Cancelar' : 'Editar'}</button></div>
        ${editing ? html`<${EditForm} asset=${a} onDone=${() => setEditing(false)} />` : html`<dl class="dl">${rows.map(([k, v]) => html`<dt>${k}</dt><dd>${v}</dd>`)}</dl>`}
      </section>
      ${(secs.length > 0 || prim || a.principalExterna) && html`<section>
        <div class="section-t"><h2>${secs.length ? 'Máquinas secundárias' : 'Máquina secundária'}</h2></div>
        ${prim && html`<p style=${{ margin: '0 0 8px', fontSize: '13px' }}>Esta é a máquina secundária de <b>${prim.responsavel || 'colaborador sem nome'}</b>. Principal: <button class="link mono" onClick=${() => open(prim.id)}>${prim.tombamento}</button> (${assetName(prim)}).</p>`}
        ${!prim && a.principalExterna && html`<p style=${{ margin: '0 0 8px', fontSize: '13px' }}>Máquina secundária. A principal é <b>${a.principalExterna}</b>.</p>`}
        ${secs.length > 0 && html`<div class="sec-list">${secs.map(({ t, x }) => x
          ? html`<button class="li" onClick=${() => open(x.id)}><span class="mono">${t}</span><span style=${{ minWidth: 0 }}><div class="t">${assetName(x)}</div><div class="d">${[ETAPA[x.etapa]?.label, x.responsavel && x.responsavel !== a.responsavel ? 'com ' + x.responsavel : null].filter(Boolean).join(' · ')}</div></span><${StatusPill} s=${x.status} /></button>`
          : html`<div class="li" style=${{ cursor: 'default' }}><span class="mono">${t}</span><span class="muted" style=${{ fontSize: '12.5px' }}>Não cadastrada no inventário</span><span></span></div>`)}</div>`}
      </section>`}
      ${rrows.length > 0 && html`<section><div class="section-t"><h2>Reparo atual</h2></div><dl class="dl">${rrows.map(([k, v]) => html`<dt>${k}</dt><dd class=${['O.S.', 'Chamado Zeev', 'Nota fiscal'].includes(k) ? 'mono' : ''}>${v}</dd>`)}</dl></section>`}
      <section>
        <div class="section-t"><h2>Histórico</h2><span class="muted num" style=${{ fontSize: '12.5px' }}>${hist.length} registros</span></div>
        <ol class="timeline">${hist.map(e => html`<li><span class=${'dot ' + e.tipo}></span><div style=${{ minWidth: 0 }}><div class="tt">${e.titulo}</div><div class="tm">${fmtDate(e.data)} · ${authorName(e, names)}${e.valor ? ' · ' + fmtMoney(e.valor) : ''}${e.os ? ' · OS ' + e.os : ''}</div>${e.texto && html`<div class="tx">${e.texto}</div>`}</div></li>`)}</ol>
      </section>
    </div>
  </aside>`;
}

function ActionForm({ action, asset, onDone }) {
  const init = Object.fromEntries((action.fields || []).map(f => [f.k, f.def ? f.def(asset) : (f.options ? f.options[0][0] : '')]));
  const [v, setV] = useState(init); const [err, setErr] = useState({}); const [busy, setBusy] = useState(false);
  const submit = async e => {
    e.preventDefault();
    const errs = {}; (action.fields || []).forEach(f => { if (f.req && !String(v[f.k] || '').trim()) errs[f.k] = 'Preencha este campo.'; });
    Object.assign(errs, action.validate?.(v) || {});
    setErr(errs); if (Object.keys(errs).length) return;
    setBusy(true);
    const ok = await Repo.commit(asset, action.apply(asset, v), action.event(asset, v));
    setBusy(false); if (ok) { (action.fields || []).filter(f => f.list === 'dl-pessoas' && v[f.k]).forEach(f => Repo.ensurePerson(v[f.k], asset.projeto)); toast(action.label + ': salvo'); onDone(); }
  };
  return html`<form class="action-form" onSubmit=${submit} noValidate>
    <h3>${action.label}</h3>
    ${(action.fields || []).map(f => html`<${Field} f=${f} id=${'af-' + action.id + '-' + f.k} value=${v[f.k]} err=${err[f.k]} onInput=${x => setV({ ...v, [f.k]: x })} />`)}
    <div class="actions"><button class=${'btn ' + (action.danger ? 'danger' : 'primary')} type="submit" disabled=${busy}>${busy ? 'Salvando…' : 'Confirmar'}</button><button class="btn ghost" type="button" onClick=${onDone}>Voltar</button></div>
  </form>`;
}
function Field({ f, id, value, err, onInput }) {
  return html`<div class="field"><label for=${id}>${f.label}${f.req ? ' *' : ''}</label>
    ${f.type === 'select' ? html`<select id=${id} value=${value} onChange=${e => onInput(e.target.value)}>${f.options.map(([val, l]) => html`<option value=${val}>${l}</option>`)}</select>`
      : f.type === 'textarea' ? html`<textarea id=${id} value=${value} onInput=${e => onInput(e.target.value)}></textarea>`
      : html`<input id=${id} type=${f.type === 'number' ? 'number' : 'text'} inputmode=${f.type === 'number' ? 'decimal' : null} list=${f.list || null} autocomplete=${f.list ? 'off' : null} placeholder=${f.placeholder || null} value=${value} onInput=${e => onInput(e.target.value)} />`}
    ${err ? html`<span class="err">${err}</span>` : f.help && html`<span class="muted" style=${{ fontSize: '12px' }}>${f.help}</span>`}</div>`;
}

/* ---------------- Cadastro e edição ---------------- */
const EDIT_FIELDS = [
  { k: 'categoria', label: 'Tipo', type: 'select', options: Object.entries(CATEG_ONE) },
  { k: 'tipo', label: 'Modelo', req: true }, { k: 'configuracao', label: 'Configuração' },
  { k: 'tombamento', label: 'Tombamento' }, { k: 'serial', label: 'Número de série' }, { k: 'imei', label: 'IMEI' },
  { k: 'ano', label: 'Ano', type: 'number' }, { k: 'centroCusto', label: 'Centro de custo' },
  { k: 'responsavel', label: 'Está com', list: 'dl-pessoas' }, { k: 'projeto', label: 'Projeto', list: 'dl-projetos' },
  { k: 'antigoDono', label: 'Antigo dono', list: 'dl-pessoas' }, { k: 'aprovador', label: 'Aprovador / gerente', list: 'dl-pessoas' },
  { k: 'apexone', label: 'Agente Apex One' }, { k: 'secundarias', label: 'Máquinas secundárias', placeholder: 'Ex.: 016235 / 016081', help: 'Tombamentos das máquinas secundárias desta pessoa, separados por /' },
  { k: 'observacoes', label: 'Observações', type: 'textarea' },
];
function validateAsset(v, assets, selfId) {
  const e = {};
  if (!String(v.tipo || '').trim()) e.tipo = 'Informe o modelo.';
  if (v.tombamento && !/^\d{6}$/.test(v.tombamento)) e.tombamento = 'Use 6 dígitos, com zeros à esquerda (ex.: 018880).';
  if (v.tombamento && assets.some(a => a.id !== selfId && a.tombamento === v.tombamento)) e.tombamento = 'Já existe um equipamento com este tombamento.';
  if (v.serial && assets.some(a => a.id !== selfId && a.serial && a.serial.toUpperCase() === v.serial.toUpperCase())) e.serial = 'Já existe um equipamento com este serial.';
  if (!v.tombamento && !v.serial && !v.imei) e.serial = 'Informe ao menos tombamento, serial ou IMEI.';
  if ((v.secundarias || []).includes(v.tombamento)) e.secundarias = 'A máquina não pode ser secundária dela mesma.';
  const other = (v.secundarias || []).map(t => [t, SEC_INDEX.get(t)]).find(([, p]) => p && p.id !== selfId);
  if (other) e.secundarias = `${other[0]} já é secundária de ${other[1].responsavel || other[1].tombamento}.`;
  return e;
}
function tidy(v) {
  const o = { ...v };
  ['tipo', 'configuracao', 'tombamento', 'serial', 'imei', 'centroCusto', 'responsavel', 'projeto', 'antigoDono', 'aprovador', 'apexone', 'observacoes'].forEach(k => { o[k] = (o[k] ?? '').toString().trim() || null; });
  if (o.tombamento && /^\d{1,6}$/.test(o.tombamento)) o.tombamento = o.tombamento.padStart(6, '0');
  if (o.serial) o.serial = o.serial.toUpperCase();
  o.ano = o.ano ? Number(o.ano) : null;
  o.secundarias = parseTombs(o.secundarias); if (!o.secundarias.length) o.secundarias = null;
  const m = `${o.tipo || ''} ${o.configuracao || ''}`.match(/\bM(\d)\b/i); if (m) o.chip = 'Apple M' + m[1];
  return o;
}
function EditForm({ asset, onDone }) {
  const assets = useStore(s => s.assets);
  const [v, setV] = useState(Object.fromEntries(EDIT_FIELDS.map(f => [f.k, f.k === 'secundarias' ? (asset.secundarias || []).join(' / ') : (asset[f.k] ?? '')])));
  const [err, setErr] = useState({}); const [busy, setBusy] = useState(false);
  const submit = async e => {
    e.preventDefault();
    const t = tidy(v); const errs = validateAsset(t, assets, asset.id); setErr(errs); if (Object.keys(errs).length) return;
    const same = (x, y) => JSON.stringify(x ?? null) === JSON.stringify(y ?? null);
    const changed = EDIT_FIELDS.filter(f => !same(asset[f.k], t[f.k])).map(f => f.label);
    if (!changed.length) { onDone(); return; }
    setBusy(true);
    const ok = await Repo.commit(asset, t, { tipo: 'edicao', titulo: 'Dados editados', texto: 'Campos: ' + changed.join(', ') });
    setBusy(false); if (ok) { [t.responsavel, t.antigoDono, t.aprovador].forEach(n => n && Repo.ensurePerson(n, t.projeto)); toast('Dados salvos'); onDone(); }
  };
  return html`<form class="stack" onSubmit=${submit} noValidate style=${{ gap: '12px' }}>
    <div class="grid-2">${EDIT_FIELDS.filter(f => f.type !== 'textarea').map(f => html`<${Field} f=${f} id=${'ed-' + f.k} value=${v[f.k]} err=${err[f.k]} onInput=${x => setV({ ...v, [f.k]: x })} />`)}</div>
    ${EDIT_FIELDS.filter(f => f.type === 'textarea').map(f => html`<${Field} f=${f} id=${'ed-' + f.k} value=${v[f.k]} err=${err[f.k]} onInput=${x => setV({ ...v, [f.k]: x })} />`)}
    <div class="actions"><button class="btn primary" disabled=${busy}>${busy ? 'Salvando…' : 'Salvar alterações'}</button><button type="button" class="btn ghost" onClick=${onDone}>Cancelar</button></div>
  </form>`;
}
function CreateDrawer({ assets, onClose, onCreated }) {
  const [v, setV] = useState({ categoria: 'notebook', tipo: '', configuracao: '', tombamento: '', serial: '', imei: '', ano: '', centroCusto: '', responsavel: '', projeto: '', antigoDono: '', aprovador: '', apexone: '', secundarias: '', observacoes: '', status: 'disponivel' });
  const [err, setErr] = useState({}); const [busy, setBusy] = useState(false);
  const submit = async e => {
    e.preventDefault();
    const t = tidy(v); const errs = validateAsset(t, assets, null); setErr(errs); if (Object.keys(errs).length) return;
    t.etapa = t.responsavel ? 'colaborador' : 'suporte';
    if (t.responsavel && t.status === 'disponivel') t.status = 'alocado';
    setBusy(true); const rec = await Repo.create(t); setBusy(false);
    if (rec) { [t.responsavel, t.antigoDono, t.aprovador].forEach(n => n && Repo.ensurePerson(n, t.projeto)); toast('Equipamento cadastrado'); onCreated(rec); }
  };
  const statusField = { k: 'status', label: 'Status', type: 'select', options: Object.entries(STATUS).filter(([k]) => k !== 'baixado').map(([k, s]) => [k, s.label]) };
  return html`<div class="scrim" onClick=${onClose}></div>
  <aside class="drawer" role="dialog" aria-modal="true" aria-label="Novo ativo">
    <div class="drawer-h"><div class="drawer-top"><div><div class="eyebrow">Cadastro</div><h1 style=${{ fontSize: '21px', marginTop: '2px' }}>Novo equipamento</h1></div><button class="btn ghost icon-btn" onClick=${onClose} aria-label="Fechar"><${Icon} n="x" s=${18} /></button></div></div>
    <form class="drawer-b" onSubmit=${submit} noValidate>
      <div class="grid-2">
        ${[...EDIT_FIELDS.filter(f => f.type !== 'textarea'), statusField].map(f => html`<${Field} f=${f} id=${'nv-' + f.k} value=${v[f.k]} err=${err[f.k]} onInput=${x => setV({ ...v, [f.k]: x })} />`)}
      </div>
      <${Field} f=${EDIT_FIELDS.find(f => f.k === 'observacoes')} id="nv-observacoes" value=${v.observacoes} onInput=${x => setV({ ...v, observacoes: x })} />
      <p class="muted" style=${{ margin: 0, fontSize: '12.5px' }}>O tombamento é salvo sempre com 6 dígitos. O sistema recusa tombamento ou serial já cadastrados.</p>
      <div class="actions"><button class="btn primary" disabled=${busy}>${busy ? 'Salvando…' : 'Cadastrar'}</button><button type="button" class="btn ghost" onClick=${onClose}>Cancelar</button></div>
    </form>
  </aside>`;
}

/* ---------------- Colaboradores ---------------- */
function People({ assets, open, setQuery }) {
  const { people, peopleLoaded, conn } = useStore(s => s);
  const [nome, setNome] = useState(''); const [projeto, setProjeto] = useState(''); const [err, setErr] = useState('');
  const [busy, setBusy] = useState(false); const [q, setQ] = useState(''); const [limit, setLimit] = useState(150);
  const [editId, setEditId] = useState(null); const [ev, setEv] = useState({}); const [confirmId, setConfirmId] = useState(null);
  const byPerson = useMemo(() => { const m = new Map(); assets.filter(a => a.status !== 'baixado' && a.responsavel).forEach(a => { const k = norm(a.responsavel); m.set(k, (m.get(k) || 0) + 1); }); return m; }, [assets]);
  const rows = useMemo(() => { const t = norm(q).trim(); return t ? people.filter(p => norm(p.nome + ' ' + (p.projeto || '')).includes(t)) : people; }, [people, q]);
  useEffect(() => setLimit(150), [q]);
  const add = async e => {
    e.preventDefault();
    const n = nome.trim(); if (!n) { setErr('Informe o nome.'); return; }
    if (people.some(p => norm(p.nome) === norm(n))) { setErr('Esse colaborador já está na lista.'); return; }
    setErr(''); setBusy(true); const ok = await Repo.addPerson(n, projeto); setBusy(false);
    if (ok) { toast('Colaborador adicionado'); setNome(''); setProjeto(''); }
  };
  const saveEdit = async p => {
    const n = (ev.nome || '').trim(); if (!n) return;
    if (people.some(x => x.id !== p.id && norm(x.nome) === norm(n))) { toast('Já existe um colaborador com esse nome.', true); return; }
    const ok = await Repo.updatePerson(p, { nome: n, projeto: (ev.projeto || '').trim() || null });
    if (ok) { toast('Colaborador atualizado'); setEditId(null); }
  };
  const remove = async p => { if (confirmId !== p.id) { setConfirmId(p.id); return; } setConfirmId(null); if (await Repo.removePerson(p)) toast('Colaborador removido da lista'); };
  const seeAssets = n => { setQuery(n); go('inventario'); };
  return html`
    <${PageHead} title="Colaboradores" sub=${`${people.length} pessoas na lista. É ela que aparece nos campos “Colaborador”, “Está com”, “Antigo dono” e “Aprovador”. Nomes novos digitados nesses campos entram aqui automaticamente.`} />
    <form class="panel panel-b" onSubmit=${add} noValidate>
      <div class="people-form">
        <div class="field"><label for="pessoa-nome">Nome completo *</label><input id="pessoa-nome" value=${nome} onInput=${e => { setNome(e.target.value); setErr(''); }} autocomplete="off" />${err && html`<span class="err">${err}</span>`}</div>
        <div class="field"><label for="pessoa-projeto">Projeto</label><input id="pessoa-projeto" list="dl-projetos" autocomplete="off" value=${projeto} onInput=${e => setProjeto(e.target.value)} placeholder="Ex.: EUROPA LISBOA (VALERIA)" /></div>
        <button class="btn primary" disabled=${busy || conn === 'offline'}><${Icon} n="plus" />${busy ? 'Salvando…' : 'Adicionar'}</button>
      </div>
    </form>
    <div class="toolbar">
      <div class="search" style=${{ maxWidth: '420px' }}><${Icon} n="search" /><input id="busca-colaboradores" type="search" placeholder="Buscar por nome ou projeto" value=${q} onInput=${e => setQ(e.target.value)} aria-label="Buscar colaboradores" /></div>
      <span class="muted num" style=${{ fontSize: '12.5px' }}>${rows.length} de ${people.length}</span>
    </div>
    ${!peopleLoaded && conn !== 'offline' ? html`<${EmptyState} />` : !people.length ? html`<div class="panel empty"><h2>Nenhum colaborador cadastrado</h2><p>Adicione pelo formulário acima.</p></div>` : html`
    <div class="table-wrap">
      <table>
        <thead><tr><th>Nome</th><th>Projeto</th><th style=${{ textAlign: 'right' }}>Equipamentos</th><th></th></tr></thead>
        <tbody>
          ${rows.slice(0, limit).map(p => editId === p.id ? html`<tr key=${p.id} class="editing">
              <td><div class="field"><input aria-label="Nome" value=${ev.nome} onInput=${e => setEv({ ...ev, nome: e.target.value })} /></div></td>
              <td><div class="field"><input aria-label="Projeto" list="dl-projetos" value=${ev.projeto} onInput=${e => setEv({ ...ev, projeto: e.target.value })} /></div></td>
              <td></td>
              <td><div class="actions-inline"><button class="btn primary sm" onClick=${() => saveEdit(p)}>Salvar</button><button class="btn ghost sm" onClick=${() => setEditId(null)}>Cancelar</button></div></td>
            </tr>` : html`<tr key=${p.id}>
              <td><div class="t">${p.nome}</div></td>
              <td class="muted">${p.projeto || '—'}</td>
              <td class="num" style=${{ textAlign: 'right' }}>${byPerson.get(norm(p.nome)) ? html`<button class="link" onClick=${() => seeAssets(p.nome)}>${byPerson.get(norm(p.nome))}</button>` : html`<span class="muted">0</span>`}</td>
              <td><div class="actions-inline">
                <button class="btn ghost sm" onClick=${() => { setEditId(p.id); setEv({ nome: p.nome, projeto: p.projeto || '' }); setConfirmId(null); }}>Editar</button>
                <button class=${'btn sm ' + (confirmId === p.id ? 'danger' : 'ghost')} onClick=${() => remove(p)} onBlur=${() => setConfirmId(c => c === p.id ? null : c)} aria-label=${'Remover ' + p.nome}>${confirmId === p.id ? 'Confirmar remoção' : html`<${Icon} n="trash" />`}</button>
              </div></td>
            </tr>`)}
        </tbody>
      </table>
      ${rows.length > limit && html`<div class="more"><button class="btn" onClick=${() => setLimit(limit + 200)}>Mostrar mais (${rows.length - limit} restantes)</button></div>`}
    </div>
    <p class="muted" style=${{ fontSize: '12.5px', margin: 0 }}>Remover alguém da lista não altera os equipamentos que estão com a pessoa.</p>`}`;
}

/* ================================================================
   5. BOOT
   ================================================================ */
render(html`<${App} />`, document.getElementById('app'));
Repo.init();
</script>
