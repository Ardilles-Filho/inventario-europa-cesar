<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><title>Inventário Europa · CESAR</title><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&display=swap">
<style>
/* Layout: app shell — barra lateral de navegação + área de trabalho; gaveta de detalhe à direita. Paleta oficial CESAR. */
:root {
  --bg: #ffffff;
  --surface: #f7f6f2;
  --surface-2: #efede6;
  --line: #e2dfd6;
  --fg: #161616;
  --fg-2: #3f3f3f;
  --muted: #6d7484;
  --accent: #ff6002;
  --accent-strong: #dd4012;
  --accent-soft: #fff0e6;
  --on-accent: #ffffff;
  --ok: #1f8a4c; --ok-soft: #e4f4ea;
  --info: #2763c4; --info-soft: #e5eefb;
  --held: #6a4bc4; --held-soft: #eee9fb;
  --bad: #c2321b; --bad-soft: #fbe7e3;
  --warn: #a66300; --warn-soft: #fbf0dc;
  --mute: #818b9d; --mute-soft: #eef0f3;
  --shadow: 0 1px 2px rgba(22,22,22,.06), 0 8px 24px rgba(22,22,22,.08);
  --font: "DM Sans", ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono: "DM Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  --r: 10px;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #161616; --surface: #1e1e1d; --surface-2: #272725; --line: #34332f;
  --fg: #f4f3ee; --fg-2: #cfcdc5; --muted: #9aa1ae;
  --accent: #ff6d1a; --accent-strong: #ff8a45; --accent-soft: #3a2214; --on-accent: #161616;
  --ok: #4fc485; --ok-soft: #173326; --info: #7aa7f0; --info-soft: #182840;
  --held: #a993f0; --held-soft: #261f3d; --bad: #f2775f; --bad-soft: #3d1c16;
  --warn: #e6a74a; --warn-soft: #3a2a12; --mute: #9aa1ae; --mute-soft: #2a2b2e;
  --shadow: 0 1px 2px rgba(0,0,0,.4), 0 8px 24px rgba(0,0,0,.45);
  color-scheme: dark;
} }
:root[data-theme="dark"] {
  --bg: #161616; --surface: #1e1e1d; --surface-2: #272725; --line: #34332f;
  --fg: #f4f3ee; --fg-2: #cfcdc5; --muted: #9aa1ae;
  --accent: #ff6d1a; --accent-strong: #ff8a45; --accent-soft: #3a2214; --on-accent: #161616;
  --ok: #4fc485; --ok-soft: #173326; --info: #7aa7f0; --info-soft: #182840;
  --held: #a993f0; --held-soft: #261f3d; --bad: #f2775f; --bad-soft: #3d1c16;
  --warn: #e6a74a; --warn-soft: #3a2a12; --mute: #9aa1ae; --mute-soft: #2a2b2e;
  --shadow: 0 1px 2px rgba(0,0,0,.4), 0 8px 24px rgba(0,0,0,.45);
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body { background: var(--bg); color: var(--fg); font-family: var(--font); font-size: 14px; line-height: 1.45; -webkit-font-smoothing: antialiased; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 30; background: var(--bg); }
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 6px; }
.mono { font-family: var(--mono); font-size: 12.5px; letter-spacing: -.01em; }
.num { font-variant-numeric: tabular-nums; }
.muted { color: var(--muted); }
h1, h2, h3 { margin: 0; text-wrap: balance; letter-spacing: -.015em; }
h1 { font-size: 24px; font-weight: 700; }
h2 { font-size: 16px; font-weight: 600; }
h3 { font-size: 13px; font-weight: 600; }
.eyebrow { font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); }

/* Shell */
#app { min-height: 100%; }
.shell { display: grid; grid-template-columns: 232px minmax(0, 1fr); min-height: 100vh; }
.side { position: sticky; top: env(safe-area-inset-top, 0px); height: calc(100vh - env(safe-area-inset-top, 0px)); border-right: 1px solid var(--line); background: var(--surface); padding: 20px 14px; padding-left: max(14px, env(safe-area-inset-left, 0px)); display: flex; flex-direction: column; gap: 22px; }
.brand { display: flex; align-items: center; gap: 10px; padding: 2px 6px; }
.brand-mark { width: 28px; height: 28px; position: relative; flex: none; }
.brand-mark i { position: absolute; border-radius: 50%; background: var(--accent); }
.brand-mark i:first-child { inset: 0 8px 8px 0; }
.brand-mark i:last-child { width: 14px; height: 14px; right: 0; bottom: 0; background: var(--fg); border-radius: 14px 0 0 0; }
.brand b { display: block; font-size: 14px; letter-spacing: -.01em; }
.brand span { display: block; font-size: 12px; color: var(--muted); }
.nav { display: flex; flex-direction: column; gap: 2px; }
.nav a { display: flex; align-items: center; gap: 10px; padding: 8px 10px; border-radius: 8px; color: var(--fg-2); text-decoration: none; font-weight: 500; }
.nav a:hover { background: var(--surface-2); }
.nav a[aria-current="page"] { background: var(--bg); color: var(--fg); box-shadow: inset 0 0 0 1px var(--line); }
.nav a[aria-current="page"] svg { color: var(--accent); }
.nav .count { margin-left: auto; font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }
.nav .count.hot { color: var(--bad); font-weight: 600; }
.side-foot { margin-top: auto; display: flex; flex-direction: column; gap: 8px; font-size: 12px; color: var(--muted); padding: 0 6px; }
.conn { display: inline-flex; align-items: center; gap: 6px; }
.conn::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: var(--mute); }
.conn.live::before { background: var(--ok); box-shadow: 0 0 0 3px var(--ok-soft); }
.conn.error::before, .conn.offline::before, .conn.timeout::before { background: var(--warn); }

.main { min-width: 0; display: flex; flex-direction: column; }
.topbar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: color-mix(in srgb, var(--bg) 88%, transparent); backdrop-filter: blur(10px); border-bottom: 1px solid var(--line); display: flex; align-items: center; gap: 12px; padding-block: 12px; padding-left: max(24px, env(safe-area-inset-left, 0px)); padding-right: max(24px, env(safe-area-inset-right, 0px)); }
.search { flex: 1; min-width: 0; max-width: 620px; position: relative; }
.search input { width: 100%; height: 38px; border-radius: 9px; border: 1px solid var(--line); background: var(--surface); padding: 0 64px 0 36px; outline: none; }
.search input:focus { border-color: var(--accent); background: var(--bg); box-shadow: 0 0 0 3px var(--accent-soft); }
.search svg { position: absolute; left: 11px; top: 11px; color: var(--muted); }
.search kbd { position: absolute; right: 10px; top: 9px; font-family: var(--mono); font-size: 11px; color: var(--muted); border: 1px solid var(--line); border-radius: 5px; padding: 1px 6px; background: var(--bg); }
.content { padding-block: 24px 64px; padding-left: max(24px, env(safe-area-inset-left, 0px)); padding-right: max(24px, env(safe-area-inset-right, 0px)); display: flex; flex-direction: column; gap: 24px; max-width: 1360px; width: 100%; }
.page-head { display: flex; align-items: flex-end; justify-content: space-between; gap: 16px; flex-wrap: wrap; }
.page-head p { margin: 4px 0 0; color: var(--muted); max-width: 70ch; }

/* Buttons & inputs */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; height: 34px; padding: 0 13px; border-radius: 8px; border: 1px solid var(--line); background: var(--bg); cursor: pointer; font-weight: 500; white-space: nowrap; }
.btn:hover { background: var(--surface); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
.btn.primary:hover { background: var(--accent-strong); border-color: var(--accent-strong); }
.btn.danger { color: var(--bad); }
.btn.ghost { border-color: transparent; background: transparent; }
.btn.ghost:hover { background: var(--surface-2); }
.btn.sm { height: 28px; padding: 0 10px; font-size: 13px; }
.btn[disabled] { opacity: .5; cursor: not-allowed; }
.icon-btn { width: 34px; padding: 0; }
.field { display: flex; flex-direction: column; gap: 5px; min-width: 0; }
.field label { font-size: 12px; font-weight: 500; color: var(--fg-2); }
.field input, .field select, .field textarea { height: 36px; border: 1px solid var(--line); border-radius: 8px; background: var(--bg); padding: 0 10px; width: 100%; min-width: 0; }
.field textarea { height: auto; min-height: 76px; padding: 8px 10px; resize: vertical; }
.field input:focus, .field select:focus, .field textarea:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
.field .err { font-size: 12px; color: var(--bad); }
.grid-2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }

/* Chips & pills */
.pill { display: inline-flex; align-items: center; gap: 6px; height: 22px; padding: 0 8px; border-radius: 999px; font-size: 12px; font-weight: 500; white-space: nowrap; background: var(--mute-soft); color: var(--fg-2); }
.pill::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: currentColor; opacity: .9; }
.pill.ok { background: var(--ok-soft); color: var(--ok); }
.pill.info { background: var(--info-soft); color: var(--info); }
.pill.held { background: var(--held-soft); color: var(--held); }
.pill.bad { background: var(--bad-soft); color: var(--bad); }
.pill.warn { background: var(--warn-soft); color: var(--warn); }
.pill.mute { background: var(--mute-soft); color: var(--mute); }
.pill.plain::before { display: none; }
.stage { font-size: 12.5px; color: var(--fg-2); white-space: nowrap; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { height: 30px; padding: 0 11px; border-radius: 999px; border: 1px solid var(--line); background: var(--bg); cursor: pointer; font-size: 13px; display: inline-flex; align-items: center; gap: 6px; }
.chip:hover { background: var(--surface); }
.chip[aria-pressed="true"] { background: var(--fg); border-color: var(--fg); color: var(--bg); }
.chip .n { font-variant-numeric: tabular-nums; opacity: .65; font-size: 12px; }
.qchip { display: inline-flex; align-items: center; gap: 6px; height: 26px; padding: 0 6px 0 10px; border-radius: 6px; background: var(--accent-soft); color: var(--accent-strong); font-size: 12.5px; font-weight: 500; }
.qchip button { border: 0; background: transparent; cursor: pointer; color: inherit; padding: 0 4px; font-size: 14px; line-height: 1; }

/* Panels */
.panel { background: var(--bg); border: 1px solid var(--line); border-radius: var(--r); }
.panel-h { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 14px 16px; border-bottom: 1px solid var(--line); }
.panel-b { padding: 16px; }
.kpis { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 12px; }
.kpi { padding: 16px; border-radius: var(--r); background: var(--surface); display: flex; flex-direction: column; gap: 6px; text-align: left; border: 1px solid transparent; cursor: pointer; }
.kpi:hover { border-color: var(--line); background: var(--bg); }
.kpi .v { font-size: 30px; font-weight: 600; letter-spacing: -.03em; font-variant-numeric: tabular-nums; line-height: 1.05; }
.kpi .l { font-size: 13px; color: var(--fg-2); font-weight: 500; }
.kpi .s { font-size: 12px; color: var(--muted); }
.kpi.accent { background: var(--accent); color: var(--on-accent); }
.kpi.accent .l, .kpi.accent .s { color: inherit; opacity: .9; }
.dash { display: grid; grid-template-columns: minmax(0, 1.35fr) minmax(0, 1fr); gap: 16px; align-items: start; }
.stack { display: flex; flex-direction: column; gap: 16px; min-width: 0; }

/* Category bars */
.bars { display: flex; flex-direction: column; gap: 12px; }
.bar-row { display: grid; grid-template-columns: 110px minmax(0, 1fr) 44px; gap: 12px; align-items: center; cursor: pointer; border-radius: 6px; }
.bar-row:hover .bar-track { box-shadow: 0 0 0 1px var(--line); }
.bar-row .lbl { font-weight: 500; font-size: 13px; }
.bar-row .tot { text-align: right; font-variant-numeric: tabular-nums; color: var(--fg-2); }
.bar-track { height: 14px; border-radius: 4px; background: var(--surface-2); display: flex; overflow: hidden; }
.bar-track span { height: 100%; }
.legend { display: flex; flex-wrap: wrap; gap: 14px; font-size: 12px; color: var(--fg-2); }
.legend i { display: inline-block; width: 9px; height: 9px; border-radius: 2px; margin-right: 6px; vertical-align: -1px; }
.c-disponivel { background: var(--ok); } .c-reservado { background: var(--info); } .c-alocado { background: var(--held); }
.c-emprestado { background: color-mix(in srgb, var(--held) 55%, var(--bg)); } .c-danificado { background: var(--bad); } .c-baixado { background: var(--mute); }

/* Pipeline */
.pipe { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 0; border: 1px solid var(--line); border-radius: var(--r); overflow: hidden; }
.pipe button { all: unset; cursor: pointer; padding: 14px; display: flex; flex-direction: column; gap: 4px; border-right: 1px solid var(--line); position: relative; }
.pipe button:last-child { border-right: 0; }
.pipe button:hover { background: var(--surface); }
.pipe button:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }
.pipe .v { font-size: 24px; font-weight: 600; font-variant-numeric: tabular-nums; letter-spacing: -.02em; }
.pipe .l { font-size: 12.5px; color: var(--fg-2); font-weight: 500; }
.pipe .s { font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }
.pipe button:not(:last-child)::after { content: ""; position: absolute; right: -6px; top: 50%; width: 10px; height: 10px; background: var(--bg); border-top: 1px solid var(--line); border-right: 1px solid var(--line); transform: translateY(-50%) rotate(45deg); z-index: 1; }

/* Lists */
.list { display: flex; flex-direction: column; }
.li { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 12px; align-items: center; padding: 10px 16px; border-top: 1px solid var(--line); cursor: pointer; text-align: left; background: none; border-left: 0; border-right: 0; border-bottom: 0; width: 100%; }
.li:first-child { border-top: 0; }
.li:hover { background: var(--surface); }
.li .t { font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.li .d { font-size: 12.5px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.sev { width: 4px; align-self: stretch; border-radius: 2px; background: var(--warn); }
.sev.bad { background: var(--bad); } .sev.info { background: var(--info); } .sev.mute { background: var(--mute); }
.avatar { width: 28px; height: 28px; border-radius: 50%; background: var(--surface-2); display: grid; place-items: center; font-size: 11px; font-weight: 600; color: var(--fg-2); }

/* Table */
.toolbar { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; justify-content: space-between; }
.filters { display: flex; flex-direction: column; gap: 10px; }
.table-wrap { overflow-x: auto; border: 1px solid var(--line); border-radius: var(--r); }
table { width: 100%; border-collapse: collapse; min-width: 880px; }
th { position: sticky; top: 0; background: var(--surface); text-align: left; font-size: 12px; font-weight: 600; color: var(--fg-2); padding: 9px 12px; border-bottom: 1px solid var(--line); white-space: nowrap; user-select: none; }
th button { all: unset; cursor: pointer; display: inline-flex; gap: 4px; align-items: center; }
th button:focus-visible { outline: 2px solid var(--accent); }
td { padding: 10px 12px; border-bottom: 1px solid var(--line); vertical-align: middle; }
tbody tr { cursor: pointer; }
tbody tr:hover td { background: var(--surface); }
tbody tr:last-child td { border-bottom: 0; }
td .t { font-weight: 500; }
td .sub { font-size: 12px; color: var(--muted); }
.flag { display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: var(--warn); margin-left: 6px; vertical-align: 1px; }
.more { display: flex; justify-content: center; padding: 12px; }

/* Board */
.board { display: grid; grid-template-columns: repeat(4, minmax(240px, 1fr)); gap: 12px; overflow-x: auto; padding-bottom: 4px; }
.col { background: var(--surface); border-radius: var(--r); padding: 10px; display: flex; flex-direction: column; gap: 8px; min-width: 0; }
.col-h { display: flex; justify-content: space-between; align-items: baseline; padding: 4px 4px 6px; }
.col-h .n { font-variant-numeric: tabular-nums; color: var(--muted); font-size: 12px; }
.card { background: var(--bg); border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; display: flex; flex-direction: column; gap: 6px; cursor: pointer; text-align: left; width: 100%; }
.card:hover { border-color: var(--fg-2); }
.card .row { display: flex; justify-content: space-between; gap: 8px; align-items: center; }
.age { font-size: 12px; font-variant-numeric: tabular-nums; color: var(--muted); }
.age.late { color: var(--bad); font-weight: 600; }

/* Drawer */
.scrim { position: fixed; inset: 0; background: rgba(22,22,22,.35); z-index: 40; animation: fade .15s ease; }
.drawer { position: fixed; top: 0; right: 0; bottom: 0; width: min(580px, 100%); background: var(--bg); z-index: 41; box-shadow: var(--shadow); display: flex; flex-direction: column; animation: slide .2s ease; padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); padding-right: env(safe-area-inset-right, 0px); }
.drawer-h { padding: 18px 20px 14px; border-bottom: 1px solid var(--line); display: flex; flex-direction: column; gap: 10px; }
.drawer-b { overflow-y: auto; padding: 18px 20px 28px; display: flex; flex-direction: column; gap: 22px; }
.drawer-top { display: flex; justify-content: space-between; gap: 12px; align-items: flex-start; }
.ids { display: flex; flex-wrap: wrap; gap: 6px 14px; color: var(--fg-2); }
.ids span b { font-weight: 500; color: var(--muted); font-family: var(--font); font-size: 12px; margin-right: 4px; }
.dl { display: grid; grid-template-columns: 140px minmax(0, 1fr); gap: 8px 14px; margin: 0; }
.dl dt { color: var(--muted); font-size: 13px; }
.dl dd { margin: 0; min-width: 0; overflow-wrap: anywhere; }
.actions { display: flex; flex-wrap: wrap; gap: 8px; }
.action-form { border: 1px solid var(--accent); border-radius: var(--r); padding: 14px; display: flex; flex-direction: column; gap: 12px; background: var(--accent-soft); }
.action-form .field input, .action-form .field select, .action-form .field textarea { background: var(--bg); }
.timeline { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; }
.timeline li { display: grid; grid-template-columns: 14px minmax(0, 1fr); gap: 12px; padding-bottom: 14px; position: relative; }
.timeline li::before { content: ""; position: absolute; left: 6px; top: 14px; bottom: 0; width: 1px; background: var(--line); }
.timeline li:last-child::before { display: none; }
.timeline .dot { width: 13px; height: 13px; border-radius: 50%; border: 2px solid var(--line); background: var(--bg); margin-top: 3px; }
.timeline .dot.reparo { border-color: var(--bad); } .timeline .dot.entrega, .timeline .dot.emprestimo { border-color: var(--held); }
.timeline .dot.devolucao, .timeline .dot.recebido { border-color: var(--ok); } .timeline .dot.nota { border-color: var(--info); }
.timeline .tt { font-weight: 500; }
.timeline .tm { font-size: 12px; color: var(--muted); }
.timeline .tx { font-size: 13px; color: var(--fg-2); margin-top: 2px; overflow-wrap: anywhere; }
.section-t { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }

/* Assistant */
.chat { display: flex; flex-direction: column; gap: 14px; }
.msg { max-width: 72ch; padding: 12px 14px; border-radius: 12px; overflow-wrap: anywhere; }
.msg.user { align-self: flex-end; background: var(--fg); color: var(--bg); border-bottom-right-radius: 4px; }
.msg.bot { align-self: flex-start; background: var(--surface); border-bottom-left-radius: 4px; }
.msg.bot p { margin: 0 0 8px; } .msg.bot p:last-child { margin: 0; }
.msg.bot ul { margin: 4px 0 8px; padding-left: 18px; }
.msg .ref { all: unset; cursor: pointer; font-family: var(--mono); font-size: 12.5px; color: var(--accent-strong); text-decoration: underline; text-underline-offset: 2px; }
.composer { display: flex; gap: 8px; position: sticky; bottom: 0; background: var(--bg); padding-block: 12px; }
.composer input { flex: 1; min-width: 0; height: 42px; border-radius: 10px; border: 1px solid var(--line); padding: 0 14px; background: var(--surface); }
.composer input:focus { outline: none; border-color: var(--accent); background: var(--bg); }
.thinking { color: var(--muted); font-size: 13px; }

/* Misc */
.banner { border-radius: var(--r); padding: 12px 14px; background: var(--warn-soft); color: var(--fg); display: flex; gap: 10px; align-items: flex-start; }
.banner b { color: var(--warn); }
.empty { padding: 40px 20px; text-align: center; color: var(--muted); display: flex; flex-direction: column; gap: 10px; align-items: center; }
.empty h2 { color: var(--fg); }

<script type="module">
import { html, render, useState, useEffect, useMemo, useRef, useCallback } from 'https://cdn.jsdelivr.net/npm/htm@3.1.1/preact/standalone.module.js';

/* ================================================================
   1. DOMÍNIO — vocabulário, regras de negócio e fluxo de estados
   ================================================================ */
const STATUS = {
  disponivel: { label: 'Disponível', tone: 'ok' },
  reservado:  { label: 'Reservado', tone: 'info' },
  alocado:    { label: 'Alocado', tone: 'held' },
  emprestado: { label: 'Emprestado', tone: 'held' },
  danificado: { label: 'Danificado', tone: 'bad' },
  baixado:    { label: 'Baixado', tone: 'mute' },
};
const ETAPA = {
  suporte:     { label: 'No suporte' },
  colaborador: { label: 'Com colaborador' },
  orcamento:   { label: 'Aguardando orçamento', repair: 1 },
  aprovacao:   { label: 'Aguardando aprovação', repair: 2 },
  reparo:      { label: 'Em reparo', repair: 3 },
  retirada:    { label: 'Pronto p/ retirada', repair: 4 },
  inviavel:    { label: 'Orçamento inviável' },
  oficina:     { label: 'Oficina CESAR' },
  baixa:       { label: 'Fora de uso' },
};
const CATEG = { notebook: 'Notebooks', celular: 'Celulares', tablet: 'Tablets', monitor: 'Monitores', desktop: 'Desktops', acessorio: 'Acessórios', outro: 'Outros' };
const CATEG_ONE = { notebook: 'Notebook', celular: 'Celular', tablet: 'Tablet', monitor: 'Monitor', desktop: 'Desktop', acessorio: 'Acessório', outro: 'Outro' };
const REPAIR_STAGES = ['orcamento', 'aprovacao', 'reparo', 'retirada'];
const FORNECEDORES = ['iPlace', 'Mané', 'iJobe', 'Applecare', 'Outra assistência'];
const STALE_DAYS = 30;

const isRepair = a => !!ETAPA[a.etapa]?.repair;
/** Papéis de acesso (coleção "acessos", um documento por e-mail). */
const PAPEIS = {
  leitor: { label: 'Leitor', desc: 'vê o inventário, sem alterar nada' },
  editor: { label: 'Editor', desc: 'vê e altera equipamentos e colaboradores' },
  admin: { label: 'Administrador', desc: 'também libera acessos e cuida do backup' },
};
const canEdit = () => ['editor', 'admin'].includes(store.state.role);
const isAdmin = () => store.state.role === 'admin';
const BACKUP_DIAS = 7;
/** Tombamentos de máquinas secundárias -> ativo principal (derivado do campo "secundarias" dos principais). */
let SEC_INDEX = new Map();
const buildSecIndex = list => { const m = new Map(); list.forEach(a => (a.secundarias || []).forEach(t => { if (!m.has(t)) m.set(t, a); })); SEC_INDEX = m; };
const primaryOf = a => (a.tombamento && SEC_INDEX.get(a.tombamento)) || null;
const isSecondary = a => !!primaryOf(a) || !!a.principalExterna;
const parseTombs = s => [...new Set((Array.isArray(s) ? s.join(' ') : String(s || '')).match(/\d{1,6}/g) || [])].map(t => t.padStart(6, '0'));
const today = () => new Date().toISOString().slice(0, 10);
const nowIso = () => new Date().toISOString();
const daysSince = iso => iso ? Math.floor((Date.now() - new Date(iso).getTime()) / 864e5) : null;
const norm = s => (s ?? '').toString().normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase();
const brl = new Intl.NumberFormat('pt-BR', { style: 'currency', currency: 'BRL', maximumFractionDigits: 0 });
const fmtMoney = v => (v == null || isNaN(v)) ? '—' : brl.format(v);
const fmtDate = iso => { if (!iso) return '—'; const d = new Date(iso.length === 10 ? iso + 'T12:00:00' : iso); return d.toLocaleDateString('pt-BR', { day: '2-digit', month: 'short', year: 'numeric' }).replace('.', ''); };
const assetName = a => a.tipo || CATEG_ONE[a.categoria] || 'Equipamento';
const assetCode = a => a.tombamento ? a.tombamento : (a.serial ? a.serial : 'sem identificação');

/** Desde quando o ativo está na etapa atual (último evento que levou a ela). */
function stageSince(a) {
  const h = a.historico || [];
  for (let i = h.length - 1; i >= 0; i--) if (h[i].para?.etapa === a.etapa) return h[i].data;
  if (isRepair(a)) return a.reparo?.entrada || null;
  return null;
}

/** Regras de qualidade de dados e alertas operacionais. */
const CHECKS = [
  { id: 'parado', sev: 'bad', title: 'Parado na assistência', hint: `Em fluxo de reparo há mais de ${STALE_DAYS} dias`,
    test: a => isRepair(a) && (daysSince(stageSince(a)) ?? 0) > STALE_DAYS, detail: a => `${daysSince(stageSince(a))} dias em "${ETAPA[a.etapa].label}"` },
  { id: 'triagem', sev: 'warn', title: 'Danificado sem encaminhamento', hint: 'Está no suporte com defeito e ainda não foi para orçamento, oficina ou baixa',
    test: a => a.status === 'danificado' && a.etapa === 'suporte', detail: a => a.reparo?.defeito || a.observacoes || 'Defeito não descrito' },
  { id: 'sem_serial', sev: 'warn', title: 'Sem número de série', hint: 'Sem serial não dá para acionar garantia nem cruzar com o Apex One',
    test: a => !a.serial && !a.imei && a.status !== 'baixado', detail: a => a.tombamento ? `Tomb. ${a.tombamento}` : 'Também sem tombamento' },
  { id: 'sem_tomb', sev: 'info', title: 'Sem tombamento', hint: 'Patrimônio não identificado na planilha',
    test: a => !a.tombamento && a.status !== 'baixado', detail: a => a.serial ? `S/N ${a.serial}` : 'Também sem serial' },
  { id: 'sem_pessoa', sev: 'warn', title: 'Com colaborador sem nome', hint: 'Status diz que está com alguém, mas não diz com quem',
    test: a => (a.etapa === 'colaborador' || a.status === 'alocado' || a.status === 'emprestado') && !a.responsavel, detail: a => STATUS[a.status]?.label },
  { id: 'reserva', sev: 'info', title: 'Reserva sem destinatário', hint: 'Marcado como reservado sem indicar para quem',
    test: a => a.status === 'reservado' && !a.reservadoPara, detail: a => a.observacoes || '' },
  { id: 'apexone', sev: 'info', title: 'Notebook em uso sem Apex One', hint: 'Notebook com colaborador sem agente Apex One registrado',
    test: a => a.categoria === 'notebook' && a.etapa === 'colaborador' && !a.apexone, detail: a => a.responsavel || '' },
  { id: 'historico', sev: 'mute', title: 'Só aparece no histórico', hint: 'Veio das abas Garantia ou Arquivo; confirmar se o equipamento ainda existe',
    test: a => a.arquivado && a.status !== 'baixado', detail: a => (a.fontes || [])[0] || '' },
];

/** Fluxo de trabalho: cada ação sabe quando vale, o que pede e o que muda. */
const ACTIONS = [
  { id: 'entregar', label: 'Entregar a colaborador', primary: true,
    when: a => ['disponivel', 'reservado'].includes(a.status) && ['suporte', 'oficina'].includes(a.etapa),
    fields: [
      { k: 'pessoa', label: 'Colaborador', req: true, list: 'dl-pessoas', def: a => a.reservadoPara || '' },
      { k: 'modo', label: 'Tipo de entrega', type: 'select', options: [['alocado', 'Alocação'], ['emprestado', 'Empréstimo']] },
      { k: 'aprovador', label: 'Aprovador / gerente', list: 'dl-pessoas', def: a => a.aprovador || '' },
      { k: 'nota', label: 'Observação', type: 'textarea' }],
    apply: (a, v) => ({ status: v.modo || 'alocado', etapa: 'colaborador', responsavel: v.pessoa, reservadoPara: null, aprovador: v.aprovador || a.aprovador }),
    event: (a, v) => ({ tipo: 'entrega', titulo: `${v.modo === 'emprestado' ? 'Emprestado' : 'Alocado'} para ${v.pessoa}`, texto: v.nota }) },
  { id: 'reservar', label: 'Reservar',
    when: a => a.status === 'disponivel' && !isRepair(a) && a.etapa !== 'colaborador',
    fields: [{ k: 'pessoa', label: 'Reservar para', req: true, list: 'dl-pessoas' }, { k: 'nota', label: 'Observação', type: 'textarea' }],
    apply: (a, v) => ({ status: 'reservado', reservadoPara: v.pessoa }),
    event: (a, v) => ({ tipo: 'reserva', titulo: `Reservado para ${v.pessoa}`, texto: v.nota }) },
  { id: 'cancelar', label: 'Cancelar reserva', when: a => a.status === 'reservado',
    apply: () => ({ status: 'disponivel', reservadoPara: null }), event: a => ({ tipo: 'reserva', titulo: 'Reserva cancelada' }) },
  { id: 'devolver', label: 'Registrar devolução', primary: true, when: a => a.etapa === 'colaborador',
    fields: [{ k: 'estado', label: 'Como voltou', type: 'select', options: [['ok', 'Funcionando'], ['defeito', 'Com defeito']] }, { k: 'nota', label: 'Observação / defeito', type: 'textarea' }],
    apply: (a, v) => ({ status: v.estado === 'defeito' ? 'danificado' : 'disponivel', etapa: 'suporte', antigoDono: a.responsavel || a.antigoDono, responsavel: null,
      reparo: v.estado === 'defeito' ? { defeito: v.nota || null } : a.reparo }),
    event: (a, v) => ({ tipo: 'devolucao', titulo: `Devolvido${a.responsavel ? ' por ' + a.responsavel : ''}`, texto: v.nota }) },
  { id: 'defeito', label: 'Registrar defeito',
    when: a => !['danificado', 'baixado'].includes(a.status) && !isRepair(a),
    fields: [{ k: 'defeito', label: 'Defeito', req: true, type: 'textarea' }],
    apply: (a, v) => ({ status: 'danificado', reparo: { defeito: v.defeito } }),
    event: (a, v) => ({ tipo: 'reparo', titulo: 'Defeito registrado', texto: v.defeito }) },
  { id: 'enviar', label: 'Enviar para assistência', primary: true,
    when: a => a.status === 'danificado' && ['suporte', 'oficina', 'inviavel'].includes(a.etapa),
    fields: [
      { k: 'fornecedor', label: 'Assistência', type: 'select', options: FORNECEDORES.map(f => [f, f]) },
      { k: 'os', label: 'Nº da O.S.' },
      { k: 'defeito', label: 'Defeito', type: 'textarea', def: a => a.reparo?.defeito || '' }],
    apply: (a, v) => ({ etapa: 'orcamento', fornecedor: v.fornecedor, reparo: { defeito: v.defeito || null, os: v.os || null, entrada: today() } }),
    event: (a, v) => ({ tipo: 'reparo', titulo: `Enviado para ${v.fornecedor}`, texto: [v.os && `O.S. ${v.os}`, v.defeito].filter(Boolean).join(' · ') }) },
  { id: 'orcar', label: 'Registrar orçamento', primary: true, when: a => a.etapa === 'orcamento',
    fields: [
      { k: 'cobertura', label: 'Cobertura', type: 'select', options: [['', 'Pago pelo CESAR'], ['Garantia', 'Garantia'], ['Applecare', 'AppleCare'], ['Recall', 'Recall']] },
      { k: 'valor', label: 'Valor do orçamento (R$)', type: 'number' }],

/**
 * Regras do Zeev de licença:
 * - aprovado (ou concluído): cada licença ligada ganha +1 ano a partir da expiração atual (ou de hoje, se já venceu);
 * - cancelado, rejeitado, voltou para "sem aprovação" ou licença desmarcada: a extensão é desfeita;
 * - o mesmo Zeev nunca estende a mesma licença duas vezes.
 */
function planLicencas(prev, next, licencas) {
  const ext = { ...(prev.extensoes || {}) };
  const ups = new Map();
  const aprovado = ['aprovado', 'concluido'].includes(next.situacao);
  const ids = next.tipo === 'licenca' ? (next.licencas || []) : [];
  const hoje = todayIso(); const num = next.numero || 'sem número';
  const find = id => licencas.find(x => x.id === id);
  if (aprovado) for (const id of ids) {
    const e = ext[id]; if (e && !e.revertido) continue;
    const l = find(id); if (!l || l.prazo === 'perpetua') continue;
    const base = l.expiracao && l.expiracao >= hoje ? l.expiracao : hoje;
    const para = addYear(base);
    ext[id] = { de: l.expiracao || null, para, data: nowIso() };
    ups.set(id, { l, patch: { expiracao: para, prazo: 'anual', foraDeUso: false, zeevs: [...new Set([...(l.zeevs || []), next.id])] },
      ev: { tipo: 'renovacao', titulo: `Renovada pelo Zeev ${num}`, texto: `Expiração: ${fmtDay(l.expiracao)} → ${fmtDay(para)}` } });
  }
  for (const [id, e] of Object.entries(ext)) {
    if (e.revertido || (aprovado && ids.includes(id))) continue;
    const l = find(id); ext[id] = { ...e, revertido: true }; if (!l) continue;
    const motivo = ids.includes(id) ? `Zeev ${num} ${(ZSIT[next.situacao]?.label || 'alterado').toLowerCase()}` : `licença desmarcada do Zeev ${num}`;
    ups.set(id, l.expiracao === e.para
      ? { l, patch: { expiracao: e.de }, ev: { tipo: 'nota', titulo: 'Renovação desfeita: ' + motivo, texto: `Expiração volta para ${fmtDay(e.de)}` } }
      : { l, patch: {}, ev: { tipo: 'nota', titulo: 'Renovação não desfeita: ' + motivo, texto: 'A data foi alterada depois da renovação. Confira a expiração desta licença.' } });
  }
  for (const id of ids) { const l = find(id); if (l && !ups.has(id) && !(l.zeevs || []).includes(next.id)) ups.set(id, { l, patch: { zeevs: [...(l.zeevs || []), next.id] }, ev: null }); }
  return { extensoes: ext, ups: [...ups.values()] };
}

  /** Aplica uma mudança + evento de histórico, com atualização otimista. */
  async commit(asset, patch, ev) {

    if (this.writing.get(asset.id)) { toast('Aguarde: a alteração anterior deste item ainda está sendo salva.'); return false; }
    const before = store.state.assets;
    const de = { status: asset.status, etapa: asset.etapa };
    const restore = () => { buildSecIndex(before); store.set({ assets: before }); };
    const next = { ...asset, ...patch, atualizadoEm: nowIso(), atualizadoPor: store.state.meId || null };
    delete next._hay;
    if (ev) next.historico = [...(asset.historico || []), { data: nowIso(), autorId: store.state.meId || null, autorNome: store.state.authUser?.nome || null, de, para: { status: next.status, etapa: next.etapa }, ...Object.fromEntries(Object.entries(ev).filter(([, v]) => v != null && v !== '')) }];

  /** Mesma lógica de commit, para a coleção de Zeevs. */
  async commitZeev(z, patch, ev) {

    if (ev) next.historico = [...(z.historico || []), { data: nowIso(), autorId: store.state.meId || null, autorNome: store.state.authUser?.nome || null, ...Object.fromEntries(Object.entries(ev).filter(([, v]) => v != null && v !== '')) }];

  /** Restaura ativos e colaboradores de um arquivo de backup (substitui os itens com o mesmo código). */
  async restore(dados, onProgress) {
    if (!isAdmin()) { toast('Só administradores restauram backup.', true); return false; }
    const escritas = [
      ...dados.ativos.map(a => ['ativos', a.id, a]),
      ...dados.colaboradores.map(c => ['colaboradores', c.id, c]),
      ...(dados.zeevs || []).map(z => ['zeevs', z.id, z]),
      ...(dados.licencas || []).map(l => ['licencas', l.id, l]),
      ...(dados.licencasChaves || []).map(c => ['licencas_chaves', c.id, { chave: c.chave }]),
    ].filter(([col, id]) => !dados.parcial || ({ ativos: store.state.assets, colaboradores: store.state.people, zeevs: store.state.zeevs, licencas: store.state.licencas }[col] || []).some(x => x.id === String(id)))
     .map(([col, id, d]) => { const { id: _i, ...rest } = d; return [col, String(id), ['colaboradores', 'licencas_chaves'].includes(col) ? rest : { ...rest, id: String(id) }]; });
    for (let i = 0; i < escritas.length; i += 400) {
      const lote = this.db.batch();
      escritas.slice(i, i + 400).forEach(([col, id, d]) => dados.parcial ? lote.set(this.db.collection(col).doc(id), clean(d), { merge: true }) : lote.set(this.db.collection(col).doc(id), clean(d)));
      await lote.commit();
      onProgress?.(Math.min(i + 400, escritas.length), escritas.length);
    }
    return escritas.length;
  },

   3. ROTEAMENTO por hash (#painel, #inventario, #reparos ...)
   ================================================================ */
const ROUTES = ['painel', 'inventario', 'reparos', 'zeevs', 'licencas', 'qualidade', 'colaboradores', 'admin'];
function useRoute() {
  const get = () => { const h = location.hash.replace('#', ''); return ROUTES.includes(h) ? h : 'painel'; };
  const [r, setR] = useState(get());
  useEffect(() => { const f = () => setR(get()); addEventListener('hashchange', f); return () => removeEventListener('hashchange', f); }, []);
  return r;
}
const go = r => { location.hash = r; };

const StatusPill = ({ s }) => html`<span class=${'pill ' + (STATUS[s]?.tone || 'mute')}>${STATUS[s]?.label || s}</span>`;
const Stage = ({ a }) => html`<span class="stage">${ETAPA[a.etapa]?.label || a.etapa}</span>`;

function NoAccess() {

function App() {

}

function Shell() {
  const rawRoute = useRoute();

  const [openZeevId, setOpenZeevId] = useState(null);
  const [creatingZeev, setCreatingZeev] = useState(false);

  const [openLicId, setOpenLicId] = useState(null);
  const [creatingLic, setCreatingLic] = useState(false);
  useEffect(() => { if (role === 'admin') return Repo.watchChaves(); }, [role]);
  const licVence = useMemo(() => licencas.filter(l => licStatus(l) === 'vence').reduce((s, l) => s + (l.quantidade || 1), 0), [licencas]);
  const zPend = useMemo(() => zeevs.filter(z => z.situacao === 'pendente').length, [zeevs]);
  const gestores = useMemo(() => [...new Set([...Object.values(GESTOR_ALIAS), ...zeevs.flatMap(z => z.aprovadores || [])])].sort((a, b) => a.localeCompare(b, 'pt-BR')), [zeevs]);
  const [query, setQuery] = useState('');
  const searchRef = useRef();
  const open = useCallback(id => setOpenId(id), []);
  const flags = useMemo(() => CHECKS.reduce((n, c) => n + (c.sev === 'bad' ? assets.filter(c.test).length : 0), 0), [assets]);
  const active = useMemo(() => assets.filter(a => a.status !== 'baixado'), [assets]);
  const repairCount = useMemo(() => assets.filter(isRepair).length, [assets]);

  useEffect(() => {
    const k = e => {
      if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 'k') { e.preventDefault(); searchRef.current?.focus(); }

  }, []);

  const openAsset = assets.find(a => a.id === openId);

  const openLic = useCallback(id => { setOpenZeevId(null); setOpenLicId(id); }, []);

  const renovar = useCallback((lics, mesLabel) => {
    const p = [...new Set(lics.map(l => l.programa))].join(', ');
    const n = lics.reduce((s, l) => s + (l.quantidade || 1), 0);
    const venc = mesLabel && mesLabel !== 'Já vencidas' ? ` com vencimento em ${mesLabel}` : '';
    setZeevPreset({ tipo: 'licenca', descricao: `Renovação de ${n} ${n === 1 ? 'licença' : 'licenças'} ${p}${venc}`, licencas: lics.map(l => l.id) });
    setOpenLicId(null); setCreatingZeev(true);
  }, []);
  const openZeevObj = zeevs.find(z => z.id === openZeevId);
  const nav = [

    ['reparos', 'Reparos', repairCount], ['zeevs', 'Zeevs', zPend], ['licencas', 'Licenças', licVence || null], ['qualidade', 'Pendências', flags], ['colaboradores', 'Colaboradores', people.length],
    ...(role === 'admin' ? [['admin', 'Administração', null]] : []),

    <aside class="side">
      <div class="brand"><div class="brand-mark"><i></i><i></i></div><div><b>Inventário Europa</b><span>Suporte · CESAR</span></div></div>
      <nav class="nav" aria-label="Seções">

  ${creatingLic && editor && html`<${LicCreate} onClose=${() => setCreatingLic(false)} onCreated=${l => { setCreatingLic(false); setOpenLicId(l.id); }} />`}
  <datalist id="dl-programas">${[...new Set(licencas.map(l => l.programa))].sort().map(p => html`<option value=${p} />`)}</datalist>
  <datalist id="gestores-list">${gestores.map(g => html`<option value=${g} />`)}</datalist>
  <div class="toasts" role="status" aria-live="polite">${toasts.map(t => html`<div class=${'toast' + (t.err ? ' err' : '')} key=${t.id}>${t.text}</div>`)}</div>`;
}

/** Listas suspensas compartilhadas: colaboradores cadastrados + nomes já usados no inventário; projetos. */
function Datalists({ assets, people }) {
  const pessoas = useMemo(() => {
    const m = new Map(); const add = n => { const t = (n || '').trim(); if (t && !m.has(norm(t))) m.set(norm(t), t); };
    people.forEach(p => add(p.nome)); assets.forEach(a => { add(a.responsavel); add(a.reservadoPara); add(a.antigoDono); add(a.aprovador); });
    return [...m.values()].sort((x, y) => x.localeCompare(y, 'pt-BR'));
  }, [assets, people]);
  const projetos = useMemo(() => [...new Set([...people.map(p => p.projeto), ...assets.map(a => a.projeto)].filter(Boolean).flatMap(p => p.split(' / ')))].sort((x, y) => x.localeCompare(y, 'pt-BR')), [assets, people]);
  return html`<datalist id="dl-pessoas">${pessoas.map(n => html`<option value=${n} />`)}</datalist><datalist id="dl-projetos">${projetos.map(n => html`<option value=${n} />`)}</datalist>`;
}

function ConnBanner({ conn }) {
  if (conn === 'offline') return html`<div class="banner"><b>Sem conexão com o banco.</b><span>Confira sua internet e recarregue a página.</span></div>`;
  if (conn === 'error') return html`<div class="banner"><b>Erro de conexão.</b><span>${store.state.connError || 'O banco não respondeu.'} Recarregue a página para tentar de novo.</span></div>`;
  if (conn === 'timeout') return html`<div class="banner"><b>O banco está demorando.</b><span>Os dados aparecem assim que a conexão responder.</span></div>`;
  return null;
}

function EmptyState() {
  const conn = useStore(s => s.conn);

  return html`<div class="panel empty"><h2>Nenhum ativo cadastrado ainda</h2><p>Se você acabou de criar o banco, rode a página de importação (importar.html) para trazer os equipamentos. Para começar do zero, use “Novo ativo” no topo da página.</p></div>`;

/* ---------------- Painel ---------------- */
function Dashboard({ assets, open, setQuery }) {
  const m = useMemo(() => {
    const act = assets.filter(a => a.status !== 'baixado');
    const ready = act.filter(a => a.status === 'disponivel' && a.etapa === 'suporte');
    const withPeople = act.filter(a => a.etapa === 'colaborador');
    const repair = act.filter(isRepair);
    const triage = act.filter(a => a.status === 'danificado' && a.etapa === 'suporte');
    const byCat = Object.keys(CATEG).map(k => { const items = act.filter(a => a.categoria === k); const by = {}; items.forEach(a => by[a.status] = (by[a.status] || 0) + 1); return { k, n: items.length, by }; }).filter(x => x.n).sort((a, b) => b.n - a.n);
    const pipe = REPAIR_STAGES.map(s => { const it = act.filter(a => a.etapa === s); return { s, n: it.length, total: it.reduce((t, a) => t + (a.reparo?.orcamento || 0), 0), late: it.filter(a => (daysSince(stageSince(a)) ?? 0) > STALE_DAYS).length }; });
    const alerts = CHECKS.filter(c => c.sev === 'bad' || c.id === 'triagem').flatMap(c => act.filter(c.test).map(a => ({ a, c }))).sort((x, y) => (daysSince(stageSince(y.a)) ?? 0) - (daysSince(stageSince(x.a)) ?? 0));
    const events = assets.flatMap(a => (a.historico || []).filter(e => e.tipo !== 'importacao' && e.data >= '2025').map(e => ({ e, a }))).sort((x, y) => y.e.data.localeCompare(x.e.data)).slice(0, 8);
    const readyByCat = Object.keys(CATEG).map(k => [k, ready.filter(a => a.categoria === k).length]).filter(x => x[1]);
    return { act, ready, withPeople, repair, triage, byCat, pipe, alerts, events, readyByCat };
  }, [assets]);
  useEffect(() => { Repo.resolveNames(m.events.map(x => x.e.autorId)); }, [m.events]);
  const names = useStore(s => s.names);

      <button class="kpi" onClick=${() => toInv('danificado suporte')}><span class="l">Aguardando triagem</span><span class="v">${m.triage.length}</span><span class="s">danificados parados no suporte</span></button>
      <button class="kpi" onClick=${() => toInv('reservado')}><span class="l">Reservados</span><span class="v">${m.act.filter(a => a.status === 'reservado').length}</span><span class="s">esperando entrega</span></button>
    </section>
    <div class="dash">
      <div class="stack">
        <section class="panel">
          <div class="panel-h"><h2>Parque por tipo e status</h2><span class="muted num">${m.act.length} ativos</span></div>
          <div class="panel-b stack">
            <div class="bars">

                <span class="lbl">${CATEG[c.k]}</span>
                <span class="bar-track" style=${{ width: (c.n / maxCat * 100) + '%' }} title=${Object.entries(c.by).map(([s, n]) => `${STATUS[s].label}: ${n}`).join(' · ')}>
                  ${Object.keys(STATUS).filter(s => c.by[s]).map(s => html`<span class=${'c-' + s} style=${{ width: (c.by[s] / c.n * 100) + '%' }}></span>`)}
                </span>
                <span class="tot">${c.n}</span></div>`)}
            </div>
            <div class="legend">${Object.keys(STATUS).filter(s => s !== 'baixado').map(s => html`<span><i class=${'c-' + s}></i>${STATUS[s].label}</span>`)}</div>

        </section>
        <section class="stack" style=${{ gap: '10px' }}>

}
const authorName = (e, names) => e.autorNome || (e.autorId ? (names[e.autorId] || 'Alguém da equipe') : (e.autor || 'Planilha'));
const initials = n => (n || '?').split(/\s+/).filter(w => w.length > 1).slice(0, 2).map(w => w[0].toUpperCase()).join('') || '·';
const PageHead = ({ title, sub, children }) => html`<div class="page-head"><div><h1>${title}</h1>${sub && html`<p>${sub}</p>`}</div>${children}</div>`;

/* ---------------- Inventário ---------------- */
const COLS = [
  ['tombamento', 'Tombamento'], ['tipo', 'Equipamento'], ['status', 'Status'], ['etapa', 'Onde está'], ['pessoa', 'Com / para'], ['serial', 'Serial'], ['atualizadoEm', 'Atualizado'],
];
function Inventory({ assets, open, query, setQuery }) {
  const [cat, setCat] = useState('todos');
  const [showBaixados, setShowBaixados] = useState(false);
  const [sort, setSort] = useState(['atualizadoEm', -1]);
  const [limit, setLimit] = useState(60);
  const parsed = useMemo(() => parseQuery(query), [query]);
  const base = useMemo(() => assets.filter(a => (showBaixados || a.status !== 'baixado')), [assets, showBaixados]);
  const searched = useMemo(() => applySearch(base, parsed), [base, parsed]);
  const counts = useMemo(() => { const c = { todos: searched.length, secundarias: 0 }; searched.forEach(a => { c[a.categoria] = (c[a.categoria] || 0) + 1; if (isSecondary(a)) c.secundarias++; }); return c; }, [searched]);
  const rows = useMemo(() => {
    const r = cat === 'todos' ? searched : cat === 'secundarias' ? searched.filter(isSecondary) : searched.filter(a => a.categoria === cat);
    const [k, dir] = sort;
    const val = a => k === 'pessoa' ? (a.responsavel || a.reservadoPara || '') : k === 'status' ? Object.keys(STATUS).indexOf(a.status) : k === 'etapa' ? (ETAPA[a.etapa]?.label || '') : (a[k] ?? '');
    return [...r].sort((x, y) => { const a = val(x), b = val(y); if (a === b) return 0; if (a === '' || a == null) return 1; if (b === '' || b == null) return -1; return (a > b ? 1 : -1) * dir; });
  }, [searched, cat, sort]);
  useEffect(() => setLimit(60), [query, cat]);
  const flagIds = useMemo(() => new Set(assets.filter(a => CHECKS.some(c => (c.sev === 'bad' || c.sev === 'warn') && c.test(a))).map(a => a.id)), [assets]);
  const removeFilter = f => {
    const words = norm(query).split(/\s+/).filter(t => { const h = VOCAB_MAP.get(t); return !(h && h.k === f.k && h.v === f.v); });
    let q = words.join(' ');
    if (f.k === 'flag') q = q.replace(/sem serial|sem tombamento|sem tomb|parados?|sem apex ?one|sem apex/g, '').trim();
    setQuery(q);
  };
  const exportCsv = async () => {
    const cols = ['tombamento', 'serial', 'imei', 'categoria', 'tipo', 'configuracao', 'status', 'etapa', 'responsavel', 'projeto', 'secundarias', 'principal', 'reservadoPara', 'antigoDono', 'aprovador', 'centroCusto', 'apexone', 'fornecedor', 'observacoes', 'atualizadoEm'];
    const esc = v => { const s = v == null ? '' : String(v); return /[";\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s; };
    const csv = '﻿' + [cols.join(';'), ...rows.map(a => cols.map(c => esc(c === 'status' ? STATUS[a[c]]?.label : c === 'etapa' ? ETAPA[a[c]]?.label : c === 'secundarias' ? (a.secundarias || []).join(' / ') : c === 'principal' ? (primaryOf(a)?.tombamento || a.principalExterna) : a[c])).join(';'))].join('\n');
    const url = URL.createObjectURL(new Blob([csv], { type: 'text/csv;charset=utf-8' }));

function ActionForm({ action, asset, onDone, commit }) {
  const init = Object.fromEntries((action.fields || []).map(f => [f.k, f.def ? f.def(asset) : (f.options ? f.options[0][0] : '')]));
  const [v, setV] = useState(init); const [err, setErr] = useState({}); const [busy, setBusy] = useState(false);
  const submit = async e => {
    e.preventDefault();
    const errs = {}; (action.fields || []).forEach(f => { if (f.req && !String(v[f.k] || '').trim()) errs[f.k] = 'Preencha este campo.'; });
    Object.assign(errs, action.validate?.(v) || {});
    setErr(errs); if (Object.keys(errs).length) return;
    setBusy(true);
    const ok = await (commit || ((a, p, e) => Repo.commit(a, p, e)))(asset, action.apply(asset, v), action.event(asset, v));
    setBusy(false); if (ok) { (action.fields || []).filter(f => f.list === 'dl-pessoas' && v[f.k]).forEach(f => Repo.ensurePerson(v[f.k], asset.projeto)); toast(action.label + ': salvo'); onDone(); }
  };
  return html`<form class="action-form" onSubmit=${submit} noValidate>
    <h3>${action.label}</h3>
    ${(action.fields || []).map(f => html`<${Field} f=${f} id=${'af-' + action.id + '-' + f.k} value=${v[f.k]} err=${err[f.k]} onInput=${x => setV({ ...v, [f.k]: x })} />`)}
    <div class="actions"><button class=${'btn ' + (action.danger ? 'danger' : 'primary')} type="submit" disabled=${busy}>${busy ? 'Salvando…' : 'Confirmar'}</button><button class="btn ghost" type="button" onClick=${onDone}>Voltar</button></div>
  </form>`;
}
function Field({ f, id, value, err, onInput }) {
  return html`<div class="field"><label for=${id}>${f.label}${f.req ? ' *' : ''}</label>
    ${f.type === 'select' ? html`<select id=${id} value=${value} onChange=${e => onInput(e.target.value)}>${f.options.map(([val, l]) => html`<option value=${val}>${l}</option>`)}</select>`
      : f.type === 'textarea' ? html`<textarea id=${id} value=${value} onInput=${e => onInput(e.target.value)}></textarea>`
      : html`<input id=${id} type=${f.type === 'number' ? 'number' : f.type === 'date' ? 'date' : 'text'} inputmode=${f.type === 'number' ? 'decimal' : null} list=${f.list || null} autocomplete=${f.list ? 'off' : null} placeholder=${f.placeholder || null} value=${value} onInput=${e => onInput(e.target.value)} />`}
    ${err ? html`<span class="err">${err}</span>` : f.help && html`<span class="muted" style=${{ fontSize: '12px' }}>${f.help}</span>`}</div>`;
}

/* ---------------- Cadastro e edição ---------------- */
const EDIT_FIELDS = [
  { k: 'categoria', label: 'Tipo', type: 'select', options: Object.entries(CATEG_ONE) },
  { k: 'tipo', label: 'Modelo', req: true }, { k: 'configuracao', label: 'Configuração' },
  { k: 'tombamento', label: 'Tombamento' }, { k: 'serial', label: 'Número de série' }, { k: 'imei', label: 'IMEI' },
  { k: 'ano', label: 'Ano', type: 'number' }, { k: 'centroCusto', label: 'Centro de custo' },
  { k: 'responsavel', label: 'Está com', list: 'dl-pessoas' }, { k: 'projeto', label: 'Projeto', list: 'dl-projetos' },
  { k: 'antigoDono', label: 'Antigo dono', list: 'dl-pessoas' }, { k: 'aprovador', label: 'Aprovador / gerente', list: 'dl-pessoas' },
  { k: 'apexone', label: 'Agente Apex One' }, { k: 'secundarias', label: 'Máquinas secundárias', placeholder: 'Ex.: 016235 / 016081', help: 'Tombamentos das máquinas secundárias desta pessoa, separados por /' },
  { k: 'observacoes', label: 'Observações', type: 'textarea' },
];
function validateAsset(v, assets, selfId) {
  const e = {};
  if (!String(v.tipo || '').trim()) e.tipo = 'Informe o modelo.';
  if (v.tombamento && !/^\d{6}$/.test(v.tombamento)) e.tombamento = 'Use 6 dígitos, com zeros à esquerda (ex.: 018880).';
  if (v.tombamento && assets.some(a => a.id !== selfId && a.tombamento === v.tombamento)) e.tombamento = 'Já existe um equipamento com este tombamento.';
  if (v.serial && assets.some(a => a.id !== selfId && a.serial && a.serial.toUpperCase() === v.serial.toUpperCase())) e.serial = 'Já existe um equipamento com este serial.';
  if (!v.tombamento && !v.serial && !v.imei) e.serial = 'Informe ao menos tombamento, serial ou IMEI.';
  if ((v.secundarias || []).includes(v.tombamento)) e.secundarias = 'A máquina não pode ser secundária dela mesma.';
  const other = (v.secundarias || []).map(t => [t, SEC_INDEX.get(t)]).find(([, p]) => p && p.id !== selfId);
  if (other) e.secundarias = `${other[0]} já é secundária de ${other[1].responsavel || other[1].tombamento}.`;
  return e;
}
function tidy(v) {
  const o = { ...v };
  ['tipo', 'configuracao', 'tombamento', 'serial', 'imei', 'centroCusto', 'responsavel', 'projeto', 'antigoDono', 'aprovador', 'apexone', 'observacoes'].forEach(k => { o[k] = (o[k] ?? '').toString().trim() || null; });
  if (o.tombamento && /^\d{1,6}$/.test(o.tombamento)) o.tombamento = o.tombamento.padStart(6, '0');
  if (o.serial) o.serial = o.serial.toUpperCase();
  o.ano = o.ano ? Number(o.ano) : null;
  o.secundarias = parseTombs(o.secundarias); if (!o.secundarias.length) o.secundarias = null;
  const m = `${o.tipo || ''} ${o.configuracao || ''}`.match(/\bM(\d)\b/i); if (m) o.chip = 'Apple M' + m[1];
  return o;
}
function EditForm({ asset, onDone }) {
  const assets = useStore(s => s.assets);
  const [v, setV] = useState(Object.fromEntries(EDIT_FIELDS.map(f => [f.k, f.k === 'secundarias' ? (asset.secundarias || []).join(' / ') : (asset[f.k] ?? '')])));
  const [err, setErr] = useState({}); const [busy, setBusy] = useState(false);
  const submit = async e => {
    e.preventDefault();
    const t = tidy(v); const errs = validateAsset(t, assets, asset.id); setErr(errs); if (Object.keys(errs).length) return;
    const same = (x, y) => JSON.stringify(x ?? null) === JSON.stringify(y ?? null);
    const changed = EDIT_FIELDS.filter(f => !same(asset[f.k], t[f.k])).map(f => f.label);
    if (!changed.length) { onDone(); return; }
    setBusy(true);
    const ok = await Repo.commit(asset, t, { tipo: 'edicao', titulo: 'Dados editados', texto: 'Campos: ' + changed.join(', ') });
    setBusy(false); if (ok) { [t.responsavel, t.antigoDono, t.aprovador].forEach(n => n && Repo.ensurePerson(n, t.projeto)); toast('Dados salvos'); onDone(); }
  };
  return html`<form class="stack" onSubmit=${submit} noValidate style=${{ gap: '12px' }}>
    <div class="grid-2">${EDIT_FIELDS.filter(f => f.type !== 'textarea').map(f => html`<${Field} f=${f} id=${'ed-' + f.k} value=${v[f.k]} err=${err[f.k]} onInput=${x => setV({ ...v, [f.k]: x })} />`)}</div>
    ${EDIT_FIELDS.filter(f => f.type === 'textarea').map(f => html`<${Field} f=${f} id=${'ed-' + f.k} value=${v[f.k]} err=${err[f.k]} onInput=${x => setV({ ...v, [f.k]: x })} />`)}
    <div class="actions"><button class="btn primary" disabled=${busy}>${busy ? 'Salvando…' : 'Salvar alterações'}</button><button type="button" class="btn ghost" onClick=${onDone}>Cancelar</button></div>
  </form>`;
}
function CreateDrawer({ assets, onClose, onCreated }) {

    if (t.responsavel && t.status === 'disponivel') t.status = 'alocado';

    <form class="drawer-b" onSubmit=${submit} noValidate>
      <div class="grid-2">
        ${[...EDIT_FIELDS.filter(f => f.type !== 'textarea'), statusField].map(f => html`<${Field} f=${f} id=${'nv-' + f.k} value=${v[f.k]} err=${err[f.k]} onInput=${x => setV({ ...v, [f.k]: x })} />`)}

    </form>
  </aside>`;
}

/* ---------------- Colaboradores ---------------- */
function People({ assets, open, setQuery }) {
  const { people, peopleLoaded, conn } = useStore(s => s);
  const [nome, setNome] = useState(''); const [projeto, setProjeto] = useState(''); const [err, setErr] = useState('');
  const [busy, setBusy] = useState(false); const [q, setQ] = useState(''); const [limit, setLimit] = useState(150);
  const [editId, setEditId] = useState(null); const [ev, setEv] = useState({}); const [confirmId, setConfirmId] = useState(null);
  const byPerson = useMemo(() => { const m = new Map(); assets.filter(a => a.status !== 'baixado' && a.responsavel).forEach(a => { const k = norm(a.responsavel); m.set(k, (m.get(k) || 0) + 1); }); return m; }, [assets]);
  const rows = useMemo(() => { const t = norm(q).trim(); return t ? people.filter(p => norm(p.nome + ' ' + (p.projeto || '')).includes(t)) : people; }, [people, q]);
  useEffect(() => setLimit(150), [q]);
  const add = async e => {
    e.preventDefault();
    const n = nome.trim(); if (!n) { setErr('Informe o nome.'); return; }
    if (people.some(p => norm(p.nome) === norm(n))) { setErr('Esse colaborador já está na lista.'); return; }
    setErr(''); setBusy(true); const ok = await Repo.addPerson(n, projeto); setBusy(false);
    if (ok) { toast('Colaborador adicionado'); setNome(''); setProjeto(''); }
  };
  const saveEdit = async p => {
    const n = (ev.nome || '').trim(); if (!n) return;
    if (people.some(x => x.id !== p.id && norm(x.nome) === norm(n))) { toast('Já existe um colaborador com esse nome.', true); return; }
    const ok = await Repo.updatePerson(p, { nome: n, projeto: (ev.projeto || '').trim() || null });
    if (ok) { toast('Colaborador atualizado'); setEditId(null); }
  };
  const remove = async p => { if (confirmId !== p.id) { setConfirmId(p.id); return; } setConfirmId(null); if (await Repo.removePerson(p)) toast('Colaborador removido da lista'); };
  const seeAssets = n => { setQuery(n); go('inventario'); };
  return html`
    <${PageHead} title="Colaboradores" sub=${`${people.length} pessoas na lista. É ela que aparece nos campos “Colaborador”, “Está com”, “Antigo dono” e “Aprovador”. Nomes novos digitados nesses campos entram aqui automaticamente.`} />
    ${canEdit() && html`<form class="panel panel-b" onSubmit=${add} noValidate>
      <div class="people-form">
        <div class="field"><label for="pessoa-nome">Nome completo *</label><input id="pessoa-nome" value=${nome} onInput=${e => { setNome(e.target.value); setErr(''); }} autocomplete="off" />${err && html`<span class="err">${err}</span>`}</div>
        <div class="field"><label for="pessoa-projeto">Projeto</label><input id="pessoa-projeto" list="dl-projetos" autocomplete="off" value=${projeto} onInput=${e => setProjeto(e.target.value)} placeholder="Ex.: EUROPA LISBOA (VALERIA)" /></div>
        <button class="btn primary" disabled=${busy || conn === 'offline'}><${Icon} n="plus" />${busy ? 'Salvando…' : 'Adicionar'}</button>
      </div>
    </form>`}
    <div class="toolbar">
      <div class="search" style=${{ maxWidth: '420px' }}><${Icon} n="search" /><input id="busca-colaboradores" type="search" placeholder="Buscar por nome ou projeto" value=${q} onInput=${e => setQ(e.target.value)} aria-label="Buscar colaboradores" /></div>
      <span class="muted num" style=${{ fontSize: '12.5px' }}>${rows.length} de ${people.length}</span>
    </div>
    ${!peopleLoaded && conn !== 'offline' ? html`<${EmptyState} />` : !people.length ? html`<div class="panel empty"><h2>Nenhum colaborador cadastrado</h2><p>Adicione pelo formulário acima.</p></div>` : html`
    <div class="table-wrap">
      <table>
        <thead><tr><th>Nome</th><th>Projeto</th><th style=${{ textAlign: 'right' }}>Equipamentos</th><th></th></tr></thead>
        <tbody>
          ${rows.slice(0, limit).map(p => editId === p.id ? html`<tr key=${p.id} class="editing">
              <td><div class="field"><input aria-label="Nome" value=${ev.nome} onInput=${e => setEv({ ...ev, nome: e.target.value })} /></div></td>
              <td><div class="field"><input aria-label="Projeto" list="dl-projetos" value=${ev.projeto} onInput=${e => setEv({ ...ev, projeto: e.target.value })} /></div></td>
              <td></td>
              <td><div class="actions-inline"><button class="btn primary sm" onClick=${() => saveEdit(p)}>Salvar</button><button class="btn ghost sm" onClick=${() => setEditId(null)}>Cancelar</button></div></td>
            </tr>` : html`<tr key=${p.id}>
              <td><div class="t">${p.nome}</div></td>
              <td class="muted">${p.projeto || '—'}</td>
              <td class="num" style=${{ textAlign: 'right' }}>${byPerson.get(norm(p.nome)) ? html`<button class="link" onClick=${() => seeAssets(p.nome)}>${byPerson.get(norm(p.nome))}</button>` : html`<span class="muted">0</span>`}</td>
              <td>${canEdit() && html`<div class="actions-inline">
                <button class="btn ghost sm" onClick=${() => { setEditId(p.id); setEv({ nome: p.nome, projeto: p.projeto || '' }); setConfirmId(null); }}>Editar</button>
                <button class=${'btn sm ' + (confirmId === p.id ? 'danger' : 'ghost')} onClick=${() => remove(p)} onBlur=${() => setConfirmId(c => c === p.id ? null : c)} aria-label=${'Remover ' + p.nome}>${confirmId === p.id ? 'Confirmar remoção' : html`<${Icon} n="trash" />`}</button>
              </div>`}</td>
            </tr>`)}
        </tbody>
      </table>
      ${rows.length > limit && html`<div class="more"><button class="btn" onClick=${() => setLimit(limit + 200)}>Mostrar mais (${rows.length - limit} restantes)</button></div>`}
    </div>
    <p class="muted" style=${{ fontSize: '12.5px', margin: 0 }}>Remover alguém da lista não altera os equipamentos que estão com a pessoa.</p>`}`;
}

/* ---------------- Zeevs ---------------- */
const zHay = z => norm([z.numero, z.descricao, z.colaborador, z.aprovacao, z.observacao, z.decididoPor, ZTIPO[z.tipo]].filter(Boolean).join(' '));
const ZCOLS = [['numero', 'Nº Zeev'], ['descricao', 'Descrição'], ['colaborador', 'Colaborador'], ['aprovacao', 'Aprovação'], ['situacao', 'Situação'], ['tipo', 'Tipo']];
function Zeevs({ zeevs, gestores, open, onNew }) {
  const loaded = useStore(s => s.zeevsLoaded);
  const conn = useStore(s => s.conn);
  const [q, setQ] = useState('');
  const [sit, setSit] = useState('todos');
  const [tipo, setTipo] = useState('todos');
  const [gestor, setGestor] = useState('');
  const [sort, setSort] = useState(['numero', -1]);
  const [limit, setLimit] = useState(80);
  const dupNums = useMemo(() => { const c = {}; zeevs.forEach(z => z.numero && (c[z.numero] = (c[z.numero] || 0) + 1)); return new Set(Object.keys(c).filter(k => c[k] > 1)); }, [zeevs]);
  const byGestor = useMemo(() => { const c = {}; zeevs.forEach(z => (z.aprovadores || []).forEach(g => c[g] = (c[g] || 0) + 1)); return c; }, [zeevs]);
  const searched = useMemo(() => {
    const words = norm(q).split(/\s+/).filter(Boolean);
    return zeevs.filter(z => (!gestor || (gestor === '__sem' ? !z.aprovadores?.length : (z.aprovadores || []).includes(gestor)))
      && words.every(w => (z._hay ||= zHay(z)).includes(w.replace(/^#\s*/, '#'))));
  }, [zeevs, q, gestor]);
  const sitCounts = useMemo(() => { const c = { todos: searched.length }; searched.forEach(z => c[z.situacao] = (c[z.situacao] || 0) + 1); return c; }, [searched]);
  const tipoCounts = useMemo(() => { const c = {}; searched.filter(z => sit === 'todos' || z.situacao === sit).forEach(z => c[z.tipo] = (c[z.tipo] || 0) + 1); return c; }, [searched, sit]);
  const rows = useMemo(() => {
    const r = searched.filter(z => (sit === 'todos' || z.situacao === sit) && (tipo === 'todos' || z.tipo === tipo));
    const [k, dir] = sort;
    const val = z => k === 'numero' ? zNum(z) : k === 'situacao' ? Object.keys(ZSIT).indexOf(z.situacao) : k === 'tipo' ? (ZTIPO[z.tipo] || '') : norm(z[k] || '');
    return [...r].sort((x, y) => { const a = val(x), b = val(y); if (a === b) return (y.ordem || 0) - (x.ordem || 0); if (a === '' || a === 0) return 1; if (b === '' || b === 0) return -1; return (a > b ? 1 : -1) * dir; });
  }, [searched, sit, tipo, sort]);
  useEffect(() => setLimit(80), [q, sit, tipo, gestor]);
  const head = html`<${PageHead} title="Zeevs" sub="Tudo o que o time pediu no Zeev: número, o que foi pedido, quem abriu e qual gestor aprovou. Abra um Zeev para registrar a aprovação ou marcar como concluído.">
    ${canEdit() && html`<button class="btn primary" onClick=${onNew}><${Icon} n="plus" />Registrar Zeev</button>`}<//>`;
  if (!zeevs.length) return html`${head}${(!loaded && conn !== 'offline') ? html`<${EmptyState} />` : html`<div class="panel empty"><h2>Nenhum Zeev registrado</h2><p>Os Zeevs importados da planilha aparecem aqui quando o banco carregar. Para registrar um novo, use “Registrar Zeev”.</p></div>`}`;
  return html`${head}
    <div class="zfilters">
      <div class="field"><label for="busca-zeev">Buscar</label><input id="busca-zeev" type="search" value=${q} onInput=${e => setQ(e.target.value)} placeholder="Número, descrição, colaborador ou gestor (ex.: #53490, sketch, Heitor)" /></div>
      <div class="field"><label for="filtro-gestor">Aprovado por</label>
        <select id="filtro-gestor" value=${gestor} onChange=${e => setGestor(e.target.value)}>
          <option value="">Todos os gestores</option><option value="__sem">Sem gestor registrado</option>
          ${gestores.filter(g => byGestor[g]).map(g => html`<option value=${g}>${g} (${byGestor[g]})</option>`)}
        </select></div>
    </div>
    <div class="toolbar">
      <div class="chips" role="group" aria-label="Situação">
        ${['todos', ...Object.keys(ZSIT)].filter(k => k === 'todos' || sitCounts[k]).map(k => html`<button class="chip" aria-pressed=${sit === k} onClick=${() => setSit(k)}>${k === 'todos' ? 'Todas' : ZSIT[k].label}<span class="n">${sitCounts[k] || 0}</span></button>`)}
      </div>
      <div class="chips" role="group" aria-label="Tipo de pedido">
        ${['todos', ...Object.keys(ZTIPO)].filter(k => k === 'todos' || tipoCounts[k]).map(k => html`<button class="chip" aria-pressed=${tipo === k} onClick=${() => setTipo(k)}>${k === 'todos' ? 'Todos os tipos' : ZTIPO[k]}${k !== 'todos' && html`<span class="n">${tipoCounts[k]}</span>`}</button>`)}
      </div>
    </div>
    ${!rows.length ? html`<div class="panel empty"><h2>Nenhum Zeev encontrado</h2><p>Tente outro termo ou limpe os filtros.</p><button class="btn" onClick=${() => { setQ(''); setSit('todos'); setTipo('todos'); setGestor(''); }}>Limpar filtros</button></div>` : html`
    <div class="table-wrap">
      <table>
        <thead><tr>${ZCOLS.map(([k, l]) => html`<th aria-sort=${sort[0] === k ? (sort[1] > 0 ? 'ascending' : 'descending') : null}><button onClick=${() => setSort([k, sort[0] === k ? -sort[1] : (k === 'numero' ? -1 : 1)])}>${l}${sort[0] === k ? (sort[1] > 0 ? ' ↑' : ' ↓') : ''}</button></th>`)}</tr></thead>
        <tbody>
          ${rows.slice(0, limit).map(z => html`<tr key=${z.id} onClick=${() => open(z.id)} tabindex="0" onKeyDown=${e => e.key === 'Enter' && open(z.id)}>
            <td class="znum">${z.numero || html`<span class="muted">sem nº</span>`}${(!z.numero || dupNums.has(z.numero)) && html`<span class="flag" title=${z.numero ? 'Número repetido em outro registro' : 'Sem número'}></span>`}</td>
            <td class="zdesc"><div class="t">${z.descricao || html`<span class="muted">Sem descrição</span>`}</div>${z.observacao && html`<div class="sub">${z.observacao}</div>`}</td>
            <td style=${{ whiteSpace: 'nowrap' }}>${z.colaborador || html`<span class="muted">—</span>`}</td>
            <td class=${'aprov' + (z.aprovacao ? '' : ' blank')}>${z.aprovacao || ''}</td>
            <td><span class=${'pill ' + (ZSIT[z.situacao]?.tone || 'mute')}>${ZSIT[z.situacao]?.label || z.situacao}</span></td>
            <td class="stage">${ZTIPO[z.tipo] || 'Outro'}</td>
          </tr>`)}
        </tbody>
      </table>
      ${rows.length > limit && html`<div class="more"><button class="btn" onClick=${() => setLimit(limit + 150)}>Mostrar mais (${rows.length - limit} restantes)</button></div>`}
    </div>
    <div class="muted num" style=${{ fontSize: '12.5px' }}>${rows.length} de ${zeevs.length} Zeevs</div>`}`;
}

      <section>

  { k: 'valor', label: 'Valor (R$)', type: 'number' },
  { k: 'observacao', label: 'Observação', type: 'textarea' },
];
function validateZeev(v, zeevs, selfId, oldNumero) {
  const e = {};
  ZFIELDS.forEach(f => { if (f.req && !String(v[f.k] || '').trim()) e[f.k] = 'Preencha este campo.'; });
  const n = normNumero(v.numero);
  if (v.numero && !n) e.numero = 'Use só números, como #53490.';
  if (n && n !== oldNumero) { const dup = zeevs.find(z => z.id !== selfId && z.numero === n); if (dup) e.numero = `O ${n} já está registrado: “${dup.descricao || 'sem descrição'}”.`; }
  return e;
}
function zeevFromForm(v, prev = {}) {
  const g = parseGestores(v.gestor);
  let situacao = prev.situacao || 'pendente';
  if (g.length && situacao === 'pendente') situacao = 'aprovado';
  if (!g.length && situacao === 'aprovado') situacao = 'pendente';
  return { numero: normNumero(v.numero), tipo: v.tipo || tipoZeev(v.descricao), descricao: v.descricao.trim().replace(/\s+/g, ' '), colaborador: v.colaborador.trim(),
    aprovadores: g, aprovacao: aprovacaoTxt(g), valor: Number(v.valor) > 0 ? Number(v.valor) : null, observacao: (v.observacao || '').trim() || null, situacao,
    licencas: (v.tipo || tipoZeev(v.descricao)) === 'licenca' ? (v.licencas || []) : [] };
}
function ZeevForm({ z, zeevs, onDone }) {
  const [v, setV] = useState({ numero: z.numero || '', tipo: z.tipo || 'outro', descricao: z.descricao || '', colaborador: z.colaborador || '', gestor: (z.aprovadores || []).join(' e '), valor: z.valor || '', observacao: z.observacao || '', licencas: z.licencas || [] });
  const [err, setErr] = useState({}); const [busy, setBusy] = useState(false);
  const submit = async e => {
    e.preventDefault(); const errs = validateZeev(v, zeevs, z.id, z.numero); setErr(errs); if (Object.keys(errs).length) return;
    const next = zeevFromForm(v, z);
    const changed = ZFIELDS.filter(f => JSON.stringify(f.k === 'gestor' ? z.aprovacao || '' : z[f.k] ?? null) !== JSON.stringify(f.k === 'gestor' ? next.aprovacao : next[f.k] ?? null)).map(f => f.label);
    if (JSON.stringify([...(z.licencas || [])].sort()) !== JSON.stringify([...next.licencas].sort())) changed.push('Licenças');
    if (!changed.length) { onDone(); return; }
    setBusy(true); const ok = await Repo.commitZeev(z, next, { tipo: 'edicao', titulo: 'Dados editados', texto: 'Campos: ' + changed.join(', ') }); setBusy(false);
    if (ok) { toast('Zeev salvo'); onDone(); }
  };
  return html`<form class="stack" style=${{ gap: '12px' }} onSubmit=${submit} noValidate>
    ${ZFIELDS.map(f => html`<${Field} f=${f} id=${'ze-' + f.k} value=${v[f.k]} err=${err[f.k]} onInput=${x => setV({ ...v, [f.k]: x, ...(f.k === 'descricao' && !z.tipo ? { tipo: tipoZeev(x) } : {}) })} />`)}
    ${v.tipo === 'licenca' && html`<${LicPicker} value=${v.licencas} onChange=${x => setV({ ...v, licencas: x })} />`}
    <div class="actions"><button class="btn primary" disabled=${busy}>${busy ? 'Salvando…' : 'Salvar'}</button><button type="button" class="btn ghost" onClick=${onDone}>Cancelar</button></div>
  </form>`;
}
function ZeevCreate({ zeevs, onClose, onCreated, preset }) {
  const [v, setV] = useState({ numero: '', tipo: 'outro', descricao: '', colaborador: '', gestor: '', valor: '', observacao: '', licencas: [], ...(preset || {}) });

    <form class="drawer-b" onSubmit=${submit} noValidate>

      ${v.tipo === 'licenca' && html`<${LicPicker} value=${v.licencas} onChange=${x => setV({ ...v, licencas: x })} />`}
      <div class="banner" style=${{ background: 'var(--surface)' }}><span>Vai aparecer assim: <b class="mono" style=${{ color: 'var(--fg)' }}>${normNumero(v.numero) || '#—'}</b> · ${v.descricao.trim() || 'descrição'} · ${v.colaborador.trim() || 'colaborador'} · <b style=${{ color: 'var(--fg)' }}>${preview || '(aprovação em branco)'}</b></span></div>
      <div class="actions"><button class="btn primary" disabled=${busy}>${busy ? 'Salvando…' : 'Registrar'}</button><button type="button" class="btn ghost" onClick=${onClose}>Cancelar</button></div>

const licHay = l => norm([l.programa, l.edicao, ...(l.usuarios || []), l.prazo && PRAZO[l.prazo], LIC_ST[licStatus(l)].label, l.expiracao && fmtDay(l.expiracao), l.origem].filter(Boolean).join(' '));
const zeevsDaLic = (l, zeevs) => zeevs.filter(z => (z.licencas || []).includes(l.id) || (l.zeevs || []).includes(z.id));

  const counts = useMemo(() => { const c = { todas: 0 }; searched.forEach(l => { const k = licStatus(l); c[k] = (c[k] || 0) + (l.quantidade || 1); c.todas += l.quantidade || 1; }); return c; }, [searched]);

  const tabela = (g) => html`<div class="table-wrap lic-table"><table>
      <thead><tr><th>Licença</th><th>Usuários</th><th class="num">Qtd.</th><th>Expiração</th><th>Situação</th><th>Chave</th><th>Zeev</th></tr></thead>
      <tbody>${g.vis.map(l => { const s = licStatus(l); const zs = zeevsDaLic(l, zeevs); const pend = zs.find(z => z.situacao === 'pendente'); return html`<tr key=${l.id} tabindex="0" onClick=${() => openLic(l.id)} onKeyDown=${e => e.key === 'Enter' && openLic(l.id)}>

function Renovacoes({ licencas, zeevs, openLic, onRenew }) {
  const now = new Date();
  const opts = [-1, 0, 1, 2].map(o => { const d = new Date(now.getFullYear(), now.getMonth() + o, 1); return { k: mesKey(d.getFullYear(), d.getMonth()), label: o === -1 ? 'Já vencidas' : `${MESES[d.getMonth()]}/${d.getFullYear()}` }; });
  const [mes, setMes] = useState(opts[1].k);
  const [sel, setSel] = useState({});
  const editor = canEdit();
  const lista = useMemo(() => licencas.filter(l => !l.foraDeUso && l.prazo !== 'perpetua' && l.prazo !== 'mensal' && l.expiracao && (mes === opts[0].k ? l.expiracao < todayIso() : l.expiracao.startsWith(mes))).sort((a, b) => a.expiracao.localeCompare(b.expiracao)), [licencas, mes]);
  const porProg = useMemo(() => { const m = new Map(); lista.forEach(l => m.set(l.programa, [...(m.get(l.programa) || []), l])); return [...m.entries()]; }, [lista]);
  useEffect(() => setSel({}), [mes]);
  const pendente = l => zeevsDaLic(l, zeevs).find(z => z.situacao === 'pendente');
  const label = opts.find(o => o.k === mes)?.label;
  return html`
    <div class="chips" role="group" aria-label="Mês">${opts.map(o => html`<button class="chip" aria-pressed=${mes === o.k} onClick=${() => setMes(o.k)}>${o.label}</button>`)}</div>
    <p class="muted" style=${{ margin: 0, fontSize: '13px' }}>${mes === opts[0].k ? 'Licenças anuais que já venceram e não estão marcadas como fora de uso.' : `Licenças anuais que vencem em ${label}.`} Marque as que vão ser renovadas e abra um Zeev por programa. Quando o Zeev for aprovado, cada licença ganha mais um ano.</p>
    ${!porProg.length ? html`<div class="panel empty"><h2>Nada para renovar ${mes === opts[0].k ? 'entre as vencidas' : 'em ' + label}</h2><p>Escolha outro mês.</p></div>` : porProg.map(([p, ls]) => {
      const marcadas = ls.filter(l => sel[l.id] ?? !pendente(l));
      return html`<section class="prog-card" style=${{ '--h': progHue(p) }}>
        <header><${ProgBadge} p=${p} s=${32} /><div style=${{ minWidth: 0 }}><h2>${p}</h2><div class="sub">${ls.length} ${ls.length === 1 ? 'licença' : 'licenças'} · ${ls.reduce((s, l) => s + (l.quantidade || 1), 0)} assentos</div></div>
          ${editor && html`<button class="btn primary sm" disabled=${!marcadas.length} onClick=${() => onRenew(marcadas, label)}>Abrir Zeev de renovação (${marcadas.length})</button>`}</header>
        <div class="renew-list">${ls.map(l => { const z = pendente(l); return html`<div class="renew-row">
          ${editor && html`<input type="checkbox" aria-label=${'Renovar ' + licNome(l)} checked=${sel[l.id] ?? !z} onChange=${e => setSel({ ...sel, [l.id]: e.target.checked })} />`}
          <button class="link-row" onClick=${() => openLic(l.id)}><span class="t">${l.edicao || l.programa}</span><span class="muted"> · ${usuariosTxt(l, 3) || ((l.quantidade || 1) + (l.quantidade > 1 ? ' assentos' : ' assento'))}</span></button>
          <span class="num" style=${{ whiteSpace: 'nowrap' }}>${fmtDay(l.expiracao)}</span>
          ${z ? html`<span class="pill warn">Zeev ${z.numero || ''} aberto</span>` : html`<span class=${'pill ' + LIC_ST[licStatus(l)].tone}>${licPrazoTxt(l)}</span>`}
        </div>`; })}</div>
      </section>`; })}`;
}

const LIC_FIELDS = [
  { k: 'programa', label: 'Programa', req: true, list: 'dl-programas', placeholder: 'Ex.: IntelliJ IDEA' },
  { k: 'edicao', label: 'Edição ou plano', placeholder: 'Ex.: Office 365, Windows 11 Pro' },

  { k: 'uso', label: 'Uso', type: 'select', options: [['em-uso', 'Em uso'], ['fora', 'Fora de uso (não renovada)']] },

const parseUsuarios = t => [...new Set(String(t || '').split(/\n|;/).map(x => x.trim().replace(/\s+/g, ' ')).filter(Boolean))];
const licFromForm = v => ({ programa: v.programa.trim().replace(/\s+/g, ' '), edicao: (v.edicao || '').trim() || null, usuarios: parseUsuarios(v.usuarios), quantidade: Math.max(1, Number(v.quantidade) || 1, parseUsuarios(v.usuarios).length),

const licToForm = l => ({ programa: l.programa || '', edicao: l.edicao || '', usuarios: (l.usuarios || []).join('\n'), quantidade: l.quantidade || 1, prazo: l.prazo || 'anual', expiracao: l.expiracao || '', uso: l.foraDeUso ? 'fora' : 'em-uso' });
function validateLic(v) { const e = {}; if (!v.programa.trim()) e.programa = 'Informe o programa.'; if (v.expiracao && !/^\d{4}-\d{2}-\d{2}$/.test(v.expiracao)) e.expiracao = 'Data inválida.'; return e; }

function LicForm({ l, onDone }) {

  </form>`;

function LicCreate({ onClose, onCreated }) {
